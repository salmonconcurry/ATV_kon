<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  /* Layout: una consola de a bordo — el plano de la nave en el centro, el panel de la sala elegida debajo y la bitácora a un lado (abajo en móvil) */
  --void:#07090a;
  --console:#0e1213;
  --rim:#25302e;
  --amber:#ffb347;
  --amber-dim:#8a6328;
  --cyan:#7fd4d0;
  --alert:#ff5a4a;
  --text:#e3dccb;
  --muted:#8c938b;
  --display:'VT323','IBM Plex Mono',ui-monospace,monospace;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--void);color:var(--text);font-family:var(--mono);font-size:14.5px;line-height:1.5;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
  background-image:radial-gradient(ellipse 90% 60% at 50% 0%,rgba(255,179,71,.07),transparent 65%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
#app{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--amber-dim);
  background:transparent;color:var(--amber);padding:8px 12px;min-height:40px;cursor:pointer;border-radius:0}
.btn:hover:not(:disabled){background:rgba(255,179,71,.1);border-color:var(--amber)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.solid{background:var(--amber);color:var(--void);border-color:var(--amber)}
.btn.solid:hover:not(:disabled){background:#ffc56b}
.btn.alert{border-color:var(--alert);color:#ffb3aa}
.btn.alert.solid{background:var(--alert);color:var(--void)}
.btn.cyan{border-color:#3f6e6b;color:var(--cyan)}
.btn.big{font-size:15px;padding:10px 18px;min-height:46px}

/* portada */
.title{display:grid;gap:22px;padding-block:18px}
.hero{display:grid;gap:10px;max-width:66ch}
.hero .eyebrow{color:var(--cyan);font-size:12.5px;letter-spacing:.25em;text-transform:uppercase}
.hero h1{font-family:var(--display);font-size:clamp(84px,22vw,180px);line-height:.8;color:var(--amber);letter-spacing:.06em;text-shadow:0 0 18px rgba(255,179,71,.35)}
.hero p{font-size:15.5px;color:#cfc8b6}
.term{border:1px solid var(--rim);background:var(--console);padding:12px 14px;font-size:13.5px;color:var(--cyan);display:grid;gap:2px}
.term b{color:var(--amber);font-weight:600}
.pick h2{font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);margin-bottom:8px}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.opt{text-align:left;display:grid;gap:4px;padding:12px 14px;cursor:pointer;background:var(--console);border:1px solid var(--rim)}
.opt:hover{border-color:var(--amber-dim)}
.opt[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.opt b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1;color:var(--amber)}
.opt span{font-size:13.5px;color:#cfc8b6}
details.rules{border:1px solid var(--rim);background:var(--console)}
details.rules summary{cursor:pointer;padding:12px 14px;font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:var(--amber)}
.rules-body{padding:0 14px 14px;display:grid;gap:8px;max-width:76ch;font-size:14px}
.rules-body h3{font-size:12.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--cyan);margin-top:8px}
.rules-body ul{margin:0;padding-left:20px;display:grid;gap:4px}

/* cabecera */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--rim)}
.brand{font-family:var(--display);font-size:40px;line-height:.8;color:var(--amber);letter-spacing:.08em}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:flex-end}
.stat{display:grid;gap:1px}
.stat .lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.stat .val{font-family:var(--display);font-size:28px;line-height:.9;color:var(--amber);font-variant-numeric:tabular-nums}
.stat.hp .val{color:var(--cyan)}
.stat.bad .val{color:var(--alert);text-shadow:0 0 10px rgba(255,90,74,.5)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.board{display:grid;gap:14px;min-width:0}
.zone{border:1px solid var(--rim);background:var(--console);padding:12px 14px;display:grid;gap:10px;min-width:0}
.zone-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 14px}
.zone-head h2{font-family:var(--display);font-size:30px;line-height:1;color:var(--amber)}
.zone-head .sub{font-size:12.5px;color:var(--muted)}
.hint{color:var(--cyan);font-size:13.5px}
.empty{color:var(--muted);font-style:italic}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* plano */
.mapwrap{background:#050707;border:1px solid var(--rim)}
.map{display:block;width:100%;height:auto;max-height:80vh}
.map .hull{fill:none;stroke:#1d2725;stroke-width:.6}
.map .corr{stroke:#3c4a46;stroke-width:1.6}
.map .vent{fill:none;stroke:#6b3a33;stroke-width:.5;stroke-dasharray:1 .9}
.map .vent.sealed{stroke:#2b2422;stroke-dasharray:.4 1.2}
.map .room{cursor:pointer}
.map .room rect.bg{fill:#0d1312;stroke:#3c4a46;stroke-width:.35}
.map .room.adj rect.bg{stroke:var(--amber-dim);stroke-width:.5}
.map .room.here rect.bg{stroke:var(--amber);stroke-width:.7;fill:#16130c}
.map .room.sel rect.bg{stroke:var(--text);stroke-width:.8}
.map .room.blocked rect.bg{fill:#1a1210}
.map .room text.nm{fill:var(--text);font-family:var(--mono);font-weight:600;font-size:2.55px;letter-spacing:0;text-transform:uppercase}
.map .room text.tag{fill:var(--muted);font-family:var(--mono);font-size:1.9px}
.map .room text.tag.warn{fill:#ff9b8e}
.map .me{fill:var(--amber)}
.map .crew{fill:var(--cyan)}
.map .crew-l{fill:#07090a;font-family:var(--mono);font-weight:600;font-size:1.7px}
.map .beast{fill:var(--alert)}
.map .ghost{fill:none;stroke:var(--alert);stroke-width:.35;stroke-dasharray:.6 .6}
.map .noise{fill:none;stroke:var(--alert);stroke-width:.35}
.map .decoy{fill:#ffd36b}
@media (prefers-reduced-motion:no-preference){
  .map .noise{animation:ping 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
  .map .beast{animation:throb 1.1s ease-in-out infinite}
}
@keyframes ping{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.25)}}
@keyframes throb{50%{opacity:.55}}

.roompanel{border:1px solid var(--rim);background:#0b0f0f;padding:10px 12px;display:grid;gap:8px}
.roompanel h3{font-family:var(--display);font-size:30px;line-height:1;color:var(--amber)}
.roompanel .meta{font-size:13.5px;color:#cfc8b6}
.roompanel .warn{color:#ff9b8e}

.inv{display:flex;flex-wrap:wrap;gap:8px}
.item{flex:1 1 200px;min-width:0;max-width:320px;border:1px solid var(--rim);background:#0b0f0f;padding:8px 10px;display:grid;gap:4px}
.item b{color:var(--amber);font-weight:600;font-size:13.5px}
.item span{font-size:12.5px;color:#bdb6a5}
.item .btn{min-height:34px;padding:5px 8px;font-size:12px;justify-self:start}
.item.part b{color:var(--cyan)}

.side{display:grid;gap:12px;min-width:0}
.panel{border:1px solid var(--rim);background:var(--console);padding:12px 14px;display:grid;gap:8px;min-width:0}
.panel h3{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan)}
.crewrow{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:5px 0;border-bottom:1px solid #1a2220}
.crewrow:last-child{border-bottom:none}
.crewrow i{width:18px;height:18px;border-radius:50%;background:var(--cyan);color:var(--void);font-style:normal;font-weight:600;font-size:11px;display:grid;place-items:center}
.crewrow.dead i{background:#3a2a28;color:#8a6a64}
.crewrow b{font-weight:600}
.crewrow small{grid-column:2;color:var(--muted);font-size:12.5px}
.crewrow .st{grid-column:2;font-size:12.5px;color:var(--cyan)}
.crewrow.dead .st{color:#ff9b8e}
.log{list-style:none;margin:0;padding:0;display:grid;gap:3px;max-height:320px;overflow-y:auto;font-size:13px}
.log li{padding:2px 0;border-bottom:1px solid #161d1c}
.log li.turn{color:var(--amber);border-bottom:none;padding-top:6px;letter-spacing:.1em}
.log li.bad{color:#ff9b8e}
.log li.good{color:var(--cyan)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px}

#mbar{display:none}
@media (max-width:720px){
  body{padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
  #app{padding-block:0 20px}
  .top{position:sticky;top:0;z-index:15;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 10px;
    padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));
    background:rgba(7,9,10,.96);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .top .brand{display:none}
  .stats{width:100%;justify-content:space-between;gap:4px 8px}
  .stat .val{font-size:25px}
  .zone{padding:10px 12px}
  .mapwrap{margin-inline:-12px;border-inline:none}
  .hide-m{display:none}
  #mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:18;gap:8px;align-items:center;
    padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
    background:rgba(7,9,10,.96);border-top:1px solid var(--amber-dim)}
  #mbar .ap{font-family:var(--display);font-size:26px;color:var(--amber);white-space:nowrap;line-height:1}
  #mbar .ap small{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em}
  #mbar .btn{flex:1 1 0;min-width:0;min-height:46px;padding:6px}
}
.overlay{position:fixed;inset:0;background:rgba(3,4,5,.9);display:grid;place-items:center;z-index:30;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.end{width:min(560px,100%);max-height:100%;overflow-y:auto;background:var(--console);border:1px solid var(--amber-dim);padding:22px;display:grid;gap:12px;box-shadow:0 0 40px rgba(255,179,71,.12)}
.end.lost{border-color:var(--alert);box-shadow:0 0 40px rgba(255,90,74,.18)}
.end .mast{font-size:11.5px;letter-spacing:.25em;text-transform:uppercase;color:var(--cyan)}
.end h2{font-family:var(--display);font-size:clamp(46px,11vw,64px);line-height:.9;color:var(--amber)}
.end.lost h2{color:var(--alert)}
.end .verdict{color:#cfc8b6}
.end table{width:100%;border-collapse:collapse;font-size:14px}
.end td{padding:4px 0;border-bottom:1px dashed #25302e}
.end td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--amber)}
.end tr.total td{border-bottom:none;font-size:17px;padding-top:8px}
.end .btn{justify-self:start}

/* conductos de mantenimiento */
.map .shaft{fill:none;stroke:#4a3a63;stroke-width:.55;stroke-dasharray:.5 1.1}
.map .shaft.open{stroke:#b48cff;stroke-width:.8;stroke-dasharray:none;filter:drop-shadow(0 0 .6px #b48cff)}
.map .shaft-k{fill:#7b6a95;font-family:var(--mono);font-size:1.9px;font-weight:600}
.map .shaft-k.open{fill:#d9c6ff}

/* criatura */
.beastbox{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13px;color:#cfc8b6}
.beastbox b{color:var(--alert);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.sed{display:flex;gap:2px;align-items:center}
.sed i{width:12px;height:12px;border:1px solid #6b3a33;display:block}
.sed i.on{background:var(--alert);border-color:var(--alert)}
.sed i.evo{border-color:var(--amber)}
.sed i.evo.on{background:var(--amber)}

/* cartas */
.cards{display:flex;flex-wrap:wrap;gap:8px}
.card{flex:1 1 170px;max-width:240px;min-width:0;border:1px solid var(--rim);border-top:3px solid var(--tc,#3c4a46);background:#0b0f0f;padding:8px 10px;display:grid;gap:5px;align-content:start}
.card .ct{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.card .ct b{font-family:var(--display);font-size:22px;line-height:1;color:var(--text);font-weight:400}
.card .cost{font-family:var(--display);font-size:22px;line-height:1;color:var(--amber);white-space:nowrap}
.card .ck{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tc,#8c938b)}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 6px;font-size:12px;color:#bdb6a5}
.card dt{color:var(--muted)}
.card dt.p{color:var(--cyan)}.card dt.h{color:var(--amber)}.card dt.f{color:#ff9b8e}
.card dd{margin:0}
.card .left{font-size:11.5px;color:var(--muted)}
.card .btn{min-height:34px;padding:5px 8px;font-size:12px}
.card.react{--tc:#ff7a66}
.t-mov{--tc:#7fd4d0}.t-atq{--tc:#ff5a4a}.t-rec{--tc:#8fdc8f}.t-reg{--tc:#ffb347}.t-rea{--tc:#ff8a78}.t-pot{--tc:#b48cff}
.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.catalog .card{max-width:none}
.card.na{opacity:.45}
details.cat summary{cursor:pointer;color:var(--amber);font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:4px 0}

/* tiradas y amenaza */
.rollbox,.threat,.choice{border:1px solid var(--amber-dim);background:#120f0a;padding:10px 12px;display:grid;gap:8px}
.threat{border-color:var(--alert);background:#1a0d0b}
.threat h3,.rollbox h3,.choice h3{font-family:var(--display);font-size:28px;line-height:1;color:var(--amber)}
.threat h3{color:var(--alert)}
.dice{display:flex;gap:6px;flex-wrap:wrap}
.die{width:34px;height:34px;display:grid;place-items:center;border:1px solid #3c4a46;font-family:var(--display);font-size:26px;color:var(--muted);background:#0b0f0f}
.die.ok{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 8px rgba(127,212,208,.35)}
.outcome{font-size:14px}
.outcome b{text-transform:uppercase;letter-spacing:.1em}
.outcome .pleno{color:var(--cyan)}.outcome .parcial{color:var(--amber)}.outcome .fallo{color:#ff9b8e}
@media (prefers-reduced-motion:no-preference){.die{animation:dieIn .35s ease-out backwards}.die:nth-child(2){animation-delay:.06s}.die:nth-child(3){animation-delay:.12s}.die:nth-child(4){animation-delay:.18s}}
@keyframes dieIn{from{transform:rotate(-90deg) scale(.4);opacity:0}}
</style>

<div id="app"></div>

<script>
'use strict';
// ---------- la nave ----------
const ROOMS = {
  puente:{n:'Puente',x:50,y:7},
  comedor:{n:'Comedor',x:21,y:20},
  enfermeria:{n:'Enfermería',x:79,y:20},
  laboratorio:{n:'Laboratorio',x:16,y:37},
  pasilloA:{n:'Pasillo A',x:50,y:35},
  criogenia:{n:'Criogenia',x:84,y:37},
  armeria:{n:'Armería',x:16,y:54},
  pasilloB:{n:'Pasillo B',x:50,y:54},
  hidroponia:{n:'Hidroponía',x:84,y:54},
  ingenieria:{n:'Ingeniería',x:21,y:71},
  control:{n:'Control esclusa',x:79,y:71},
  reactor:{n:'Reactor',x:21,y:88},
  bodega:{n:'Bodega',x:79,y:88},
  lanzadera:{n:'Lanzadera',x:50,y:103}
};
const CORR = [['puente','comedor'],['puente','enfermeria'],['comedor','pasilloA'],['enfermeria','pasilloA'],['comedor','laboratorio'],['enfermeria','criogenia'],
  ['pasilloA','laboratorio'],['pasilloA','criogenia'],['pasilloA','pasilloB'],['laboratorio','armeria'],['pasilloB','armeria'],['pasilloB','hidroponia'],
  ['pasilloB','ingenieria'],['pasilloB','control'],['ingenieria','reactor'],['control','bodega'],['reactor','lanzadera'],['bodega','lanzadera'],['criogenia','hidroponia']];
const VENTS = [['comedor','armeria'],['enfermeria','control'],['laboratorio','ingenieria'],['hidroponia','bodega'],['armeria','reactor'],['puente','pasilloB'],['criogenia','lanzadera']];
// conductos de mantenimiento: atajos cerrados hasta que insertas una tarjeta de acceso (la criatura siempre puede usarlos)
const SHAFTS = [['comedor','hidroponia'],['laboratorio','control'],['criogenia','ingenieria'],['armeria','bodega']];
const CADJ={},VADJ={},SADJ={};
for(const k of Object.keys(ROOMS)){CADJ[k]=[];VADJ[k]=[];SADJ[k]=[];}
for(const [a,b] of CORR){CADJ[a].push(b);CADJ[b].push(a);}

SHAFTS.forEach(([a,b],i)=>{SADJ[a].push({to:b,i});SADJ[b].push({to:a,i});});

const DIFF = {
  tripulante:{n:'Tripulante',x:'7 de Salud y 24 turnos de soporte vital. La cría aguanta 3 de daño y empieza sin Sed.',hp:7,turns:24,chp:3,sed:0,panic:0},
  superviviente:{n:'Superviviente',x:'6 de Salud y 20 turnos. La cría aguanta 4 de daño y empieza con 1 de Sed.',hp:6,turns:20,chp:4,sed:1,panic:0},
  pesadilla:{n:'Pesadilla',x:'5 de Salud, 18 turnos y 2 de Pánico. La cría aguanta 5 de daño y empieza con 2 de Sed.',hp:5,turns:18,chp:5,sed:2,panic:2}
};
const ALIENTO = 6, HAND = 5, MAXINV = 6, MAXFOLLOW = 2, KEYS_TOTAL = 7, KEYS_DESTRUCT = 4;

// ---------- la criatura: cría → juvenil → adulta ----------
const STAGES = {
  cria:{n:'Cría',dmg:1,x:'Pequeña y torpe. Solo lo que caza ella misma le da Sed.'},
  juvenil:{n:'Juvenil',dmg:2,x:'Puede desvanecerse en las sombras y emboscarte.'},
  adulta:{n:'Adulta',dmg:3,x:'Se mueve el doble y atraviesa los conductos sellados. Sus emboscadas hacen +1 de daño.'}
};
const SED_MAX = 10, SED_EVOLVE = {4:'juvenil',8:'adulta'};
const INSTINCTS = ['cazar','cazar','cazar','cazar','acechar','acechar','emboscar','rugido','alimentarse','alimentarse','desvanecerse','desvanecerse'];
// emboscadas: dónde reaparece cuando está oculta (cara joven y cara adulta)
const AMBUSH = {
  joven:[
    {h:'Desde el techo',x:'Cae sobre ti: aparece en tu sala y ataca.',where:'you'},
    {h:'Respiración en la rejilla',x:'Aparece en una sala unida a la tuya por conducto. +1 Pánico.',where:'vent',panic:1},
    {h:'Rastro de sangre',x:'Aparece junto al tripulante más cercano y lo ataca.',where:'crew'},
    {h:'Sombras',x:'Sigue oculta. +1 Pánico.',where:null,panic:1},
    {h:'Hacia el ruido',x:'Aparece donde se oyó el último ruido.',where:'noise'},
    {h:'Muy lejos',x:'Aparece en la sala más alejada de ti.',where:'far'}],
  adulta:[

const KIND = {mov:'Movimiento',atq:'Ataque',rec:'Recuperación',reg:'Registro',rea:'Reacción',pot:'Potenciador'};
const CARDS = {

};
const PASSIVE=['pelos','repetir'];

let G=null;
const UI={diff:'superviviente',sel:null,confirmQuit:false};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const d6=()=>1+Math.floor(Math.random()*6);
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
function log(m,cls=''){G.log.unshift({m,cls});if(G.log.length>180)G.log.length=180;}
function panic(n){G.panic=Math.max(0,Math.min(10,G.panic+n));}
function heal(n){G.hp=Math.min(G.maxHp,G.hp+n);}
const R=r=>ROOMS[r].n;

// ---------- utilidades del plano ----------
function ventOpen(a,b,beast){if(beast&&G.beast.stage==='adulta')return true;return !G.welded.includes(a)&&!G.welded.includes(b);}
function shaftOpen(i){return G.shafts.includes(i);}
function neighbors(r,mode,beast){ // mode: 'corr' | 'vent' | 'all'
  const out=[];
  if(mode!=='vent')out.push(...CADJ[r]);
  if(mode!=='corr'){out.push(...VADJ[r].filter(v=>ventOpen(r,v,beast)));out.push(...SADJ[r].filter(s=>beast||shaftOpen(s.i)).map(s=>s.to));}
  return [...new Set(out)];
}
function bfs(from,mode,beast){
  const dist={[from]:0},prev={},q=[from];
  while(q.length){const r=q.shift();for(const n of neighbors(r,mode,beast))if(!(n in dist)){dist[n]=dist[r]+1;prev[n]=r;q.push(n);}}
  return {dist,prev};
}
function pathTo(from,to,mode,beast){const {dist,prev}=bfs(from,mode,beast);if(!(to in dist))return null;const p=[to];while(p[0]!==from)p.unshift(prev[p[0]]);return p;}
function distance(a,b){const d=bfs(a,'all',true).dist[b];return d===undefined?99:d;}
function beastAt(r){return !G.beast.hidden&&G.beast.room===r;}
function followers(){return G.crew.filter(c=>c.alive&&c.follow);}
function crewIn(r){return G.crew.filter(c=>c.alive&&c.room===r);}
function hasCrew(id){return G.crew.some(c=>c.id===id&&c.alive&&c.follow);}
function has(id){return G.inv.some(i=>i.id===id);}
function item(id){return G.inv.find(i=>i.id===id);}
function dropItem(id){const i=G.inv.findIndex(x=>x.id===id);if(i>=0)G.inv.splice(i,1);}
function spendItem(id){dropItem(id);if(!ITEMS[id].part)G.spent.push(id);}
function beastSpeed(){return G.beast.stage==='adulta'?2:1;}
function visible(){
  if(G.beast.hidden)return false;
  if(G.beast.room===G.pos||G.flags.radar)return true;
  return has('detector')&&!G.flags.blind&&distance(G.pos,G.beast.room)<=3;
}
function markNoise(room,kind){G.noise=G.noise.filter(n=>n.room!==room);G.noise.push({room,kind,turn:G.turn});}
function seeBeast(){if(visible())G.lastSeen={room:G.beast.room,turn:G.turn};}

// ---------- partida ----------
function newGame(diff){
  const df=DIFF[diff];
  G={diff,turn:0,maxTurn:df.turns,aliento:0,hp:df.hp,maxHp:df.hp,panic:df.panic,pos:'criogenia',inv:[],spent:[],cannon:null,
     crew:[],beast:{room:'laboratorio',hp:df.chp,maxHp:df.chp,stun:0,ambush:false,stage:'cria',sed:0,hidden:false,lost:0},
     instincts:[],ambushDeck:[],decoy:null,welded:[],noise:[],decks:{},searched:{},destruct:null,lastSeen:{room:'laboratorio',turn:0},
     blocked:null,flags:{},events:shuffle(Object.keys(EVENTS)),keys:0,shafts:[],
     hand:['avanzar','registrar'],used:{},steps:null,roll:null,threat:null,choice:null,lastPlayed:null,
     log:[],phase:'play',result:null};
  // objetos por la nave: las piezas del cañón tienen sala fija y las tarjetas de acceso van mezcladas con el resto
  const fixed={reactor:['celula'],laboratorio:['bobina'],armeria:['carcasa']};
  const pool=shuffle(['detector','lanzallamas','bengala','bengala','botiquin','botiquin','soldador','adrenalina','sedante','botiquin',...Array(KEYS_TOTAL).fill('acceso')]);
  const rooms=Object.keys(ROOMS).filter(r=>r!=='lanzadera'&&!r.startsWith('pasillo'));
  for(const r of Object.keys(ROOMS))G.decks[r]=[...(fixed[r]||[])];
  pool.forEach((it,i)=>G.decks[rooms[i%rooms.length]].push(it));
  for(const r of Object.keys(G.decks))shuffle(G.decks[r]);
  const startRooms=shuffle(Object.keys(ROOMS).filter(r=>!['criogenia','laboratorio','lanzadera'].includes(r)));
  Object.keys(CREW).forEach((id,i)=>G.crew.push({id,room:startRooms[i],follow:false,alive:true}));
  UI.sel='criogenia';UI.confirmQuit=false;
  log('Despiertas en Criogenia. Las alarmas llevan horas sonando. Algo salió del Laboratorio, y todavía es pequeño.');
  log('Objetivo: abátela, expúlsala por la esclusa o reúne 4 tarjetas de acceso, activa la autodestrucción en el Puente y huye en la lanzadera.');
  if(df.sed)feed(df.sed,true,true);
  startTurn();
}
function startTurn(){
  G.turn++;G.flags={};G.steps=null;G.used={};G.lastPlayed=null;
  if(G.blocked&&G.turn>G.blocked.until)G.blocked=null;
  G.noise=G.noise.filter(n=>G.turn-n.turn<=2);
  log(`Turno ${G.turn} · soporte vital ${G.maxTurn-G.turn+1}`,'turn');
  if(G.turn>G.maxTurn){lose('oxigeno');return;}
  // el hambre: desde juvenil, la Sed sube sola cada 3 turnos
  if(G.turn%3===0)feed(1,false);
  if(G.turn>1&&G.turn%4===0){
    if(!G.events.length)G.events=shuffle(Object.keys(EVENTS));
    const id=G.events.pop();const r=EVENTS[id].run();
    log(`Aviso de a bordo · ${EVENTS[id].h}${r?': '+r:''}. ${EVENTS[id].x}`,'bad');
  }
  G.aliento=G.panic>=7?ALIENTO-2:ALIENTO;
  if(G.panic>=7)log('El pánico te atenaza: solo tienes 4 de Aliento.','bad');
  seeBeast();check();
}
function check(){
  if(!G||G.phase==='over')return;
  if(G.hp<=0)lose('muerte');
  else if(G.panic>=10)lose('panico');
}
function lose(reason){G.phase='over';G.result={win:false,reason};G.threat=null;G.roll=null;G.choice=null;}
function win(kind){
  G.phase='over';G.threat=null;G.roll=null;G.choice=null;
  const base={canon:12,abatida:12,esclusa:10,huida:7}[kind];
  const alive=kind==='huida'?followers().length:G.crew.filter(c=>c.alive).length;
  const rows=[[{canon:'Criatura abatida',abatida:'Criatura abatida',esclusa:'Criatura expulsada al vacío',huida:'Huida en la lanzadera'}[kind],base],
    [`Fase de la criatura (${STAGES[G.beast.stage].n})`,{cria:0,juvenil:2,adulta:5}[G.beast.stage]],
    [`Tripulantes que sobreviven (${alive})`,alive*3],[`Salud restante (${G.hp})`,G.hp],
    ['Soporte vital sobrante',Math.floor((G.maxTurn-G.turn)/2)],[`Pánico (${G.panic})`,-Math.floor(G.panic/2)]];
  G.result={win:true,kind,rows,total:rows.reduce((s,r)=>s+r[1],0)};
}

// ---------- Sed y evolución ----------
// en fase de cría solo cuenta lo que caza ella misma (direct)
function feed(n,direct,quiet){
  const B=G.beast;if(B.stage==='cria'&&!direct)return;
  for(let k=0;k<n&&B.sed<SED_MAX;k++){B.sed++;const next=SED_EVOLVE[B.sed];if(next)evolve(next,quiet);}
}
function evolve(stage,quiet){
  const B=G.beast;B.stage=stage;
  if(stage==='juvenil'){if(!quiet){log('Encuentras una muda de piel en el suelo. La criatura ya es JUVENIL: ahora puede desvanecerse y emboscarte.','bad');panic(1);}return;}
  // adulta: más Vida, se cura del todo y la baraja de emboscadas cambia de cara
  B.maxHp=DIFF[G.diff].chp*2+2;B.hp=B.maxHp;G.ambushDeck=[];
  if(!quiet){log(`Un rugido hace vibrar el casco. La criatura es ADULTA: ${B.maxHp} de Vida, se mueve el doble y atraviesa los conductos sellados.`,'bad');panic(2);}
}

// ---------- cartas ----------
const busy=()=>G.phase!=='play'||!!G.roll||!!G.choice||!!G.threat;
function inHand(id){return G.hand.filter(h=>h===id).length;}
function copiesLeft(id){return CARDS[id].q-inHand(id)-(G.used[id]||0);}
function canPrepare(id){return !busy()&&G.hand.length<HAND&&copiesLeft(id)>0&&G.aliento>=CARDS[id].c;}
function prepare(id){if(!canPrepare(id))return;G.aliento-=CARDS[id].c;G.hand.push(id);log(`Preparas «${CARDS[id].n}» (${CARDS[id].c} Aliento).`);}
function discardCard(id){const i=G.hand.indexOf(id);if(i>=0){G.hand.splice(i,1);G.used[id]=(G.used[id]||0)+1;}}
function attackRange(id){return id==='arrojar'?(G.cannon?2:2):(G.cannon&&G.cannon.charges>0?1:0);}
function inRange(range){if(!visible())return false;const r=G.beast.room;if(r===G.pos)return true;if(range<1)return false;const d=bfs(G.pos,'corr').dist[r];return d!==undefined&&d<=range;}
function canPlay(id){
  if(busy()||!G.hand.includes(id))return false;
  const d=CARDS[id];
  if(d.t==='rea'||PASSIVE.includes(id))return false;
  if(d.t==='atq'){if(!inRange(attackRange(id)))return false;if(id==='arrojar'&&!G.inv.some(i=>!ITEMS[i.id].part))return false;}
  if(id==='rescate')return CADJ[G.pos].some(r=>crewIn(r).some(c=>!c.follow))&&followers().length<MAXFOLLOW;
  if(id==='rebuscar')return G.spent.length>0;
  return true;
}
function play(id){
  if(!canPlay(id))return;
  if(id==='arrojar'){const opts=[...new Set(G.inv.filter(i=>!ITEMS[i.id].part).map(i=>i.id))];G.choice={title:'¿Qué arrojas?',kind:'arrojar',opts:opts.map(v=>({v,l:ITEMS[v].n}))};return;}
  startCard(id,{});
}
function startCard(id,ctx){
  discardCard(id);
  const d=CARDS[id];
  if(!d.roll){applyCard(id,'pleno',ctx);return;}
  G.roll={id,ctx,dice:rollDice(),rerolled:false};
}
// tirada de Nervio: un dado menos por cada 3 de Pánico; éxito con 5+ (4+ con Improvisar)
function nerve(){return Math.max(1,4-Math.floor(G.panic/3));}
function rollDice(){return Array.from({length:nerve()},d6);}
function target(){return G.flags.improv||G.flags.improvNext?4:5;}
function successes(r){return r.dice.filter(x=>x>=target()).length+(G.flags.plan||0);}
function outcomeOf(r){const s=successes(r);return s>=2?'pleno':s===1?'parcial':'fallo';}
function rerollFailed(){
  const r=G.roll;if(!r||r.rerolled||!G.hand.includes('pelos'))return;
  discardCard('pelos');r.dice=r.dice.map(x=>x>=target()?x:d6());r.rerolled=true;log('Por los pelos: repites los dados fallados.','good');
}
function acceptRoll(){
  const r=G.roll;if(!r)return;
  const out=outcomeOf(r);G.roll=null;
  G.flags.improvNext=false;G.flags.plan=0;
  applyCard(r.id,out,r.ctx);
}
function applyCard(id,out,ctx){
  const d=CARDS[id],k=['pleno','parcial','fallo'].indexOf(out);
  log(`${d.n}: ${out.toUpperCase()}${d.o[k]?' — '+d.o[k]:''}.`,out==='fallo'?'bad':'good');
  if(d.t==='rea'){resolveReaction(id,out);return;}
  const fx=EFFECTS[id];if(fx)fx(out,ctx);
  if(G.phase==='over')return;
  if(d.c>0&&!d.ends)G.lastPlayed=id;
  seeBeast();check();
  if(d.ends&&G.phase==='play'&&!G.choice)endTurn();
}
function giveSteps(n,safe){G.steps={n:(G.steps?.n||0)+n,safe:!!safe||!!G.steps?.safe};}
function hurtBeast(n,how){
  const B=G.beast;if(n<=0)return;
  let dmg=n+(hasCrew('sato')?1:0);
  if(G.cannon&&G.cannon.charges>0&&how!=='arrojar'){G.cannon.charges--;dmg+=2;log(`El cañón de plasma escupe fuego (+2 de daño, quedan ${G.cannon.charges} cargas).`);}
  B.hp-=dmg;markNoise(B.room,'chillido');
  log(`Le haces ${dmg} de daño. Le queda ${Math.max(0,B.hp)} de ${B.maxHp} de Vida.`,'good');
  if(B.hp<=0){log('La criatura se desploma entre espasmos. Se acabó.','good');win('abatida');return;}
  beastRetreat(2);log('Huye herida.','good');
}
const EFFECTS = {
  avanzar:o=>{giveSteps(o==='pleno'?2:1);if(o==='fallo')panic(1);},
  correr:o=>giveSteps(o==='pleno'?3:o==='parcial'?2:1),
  escabullirse:o=>giveSteps(o==='pleno'?2:1,o!=='fallo'),
  golpe:o=>{if(o!=='fallo')hurtBeast(1);if(o!=='pleno')panic(1);},
  arrojar:(o,c)=>{spendItem(c.item);const range=o==='pleno'?2:1;if(o!=='fallo'&&inRange(range))hurtBeast(o==='pleno'?2:1,'arrojar');else if(o!=='fallo')log('No llega hasta ella.');},
  plantar:o=>{if(o==='fallo'){panic(1);return;}beastRetreat(o==='pleno'?3:2);if(o==='pleno')G.beast.stun=1;},
  embestida:o=>{if(o!=='fallo')hurtBeast(o==='pleno'?2:1);},
  certero:o=>hurtBeast(o==='pleno'?3:o==='parcial'?2:1),
  respirar:o=>{if(o==='fallo')return;panic(o==='pleno'?-2:-1);if(o==='pleno'&&hasCrew('brandt'))heal(1);},
  calma:o=>{panic(o==='pleno'?-3:o==='parcial'?-2:-1);if(o==='pleno'&&hasCrew('brandt'))heal(1);},
  rescate:()=>{const c=CADJ[G.pos].flatMap(r=>crewIn(r)).find(c=>!c.follow);if(c){c.room=G.pos;c.follow=true;log(`${CREW[c.id].n} corre hasta ti y se une.`,'good');}panic(-1);},
  descanso:o=>{if(o==='pleno'){heal(2+(hasCrew('brandt')?1:0));panic(-2);}else if(o==='parcial'){heal(1);panic(-1);}else panic(-1);},
  registrar:o=>doSearch(o),
  rebuscar:o=>{if(o==='fallo'||!G.spent.length)return;if(o==='parcial'){const i=Math.floor(Math.random()*G.spent.length);takeItem(G.spent.splice(i,1)[0]);return;}
    const opts=[...new Set(shuffle([...G.spent]).slice(0,2))];if(opts.length===1){G.spent.splice(G.spent.indexOf(opts[0]),1);takeItem(opts[0]);return;}G.choice={title:'Rebuscas entre los restos',kind:'rebuscar',opts:opts.map(v=>({v,l:ITEMS[v].n}))};},
  concentrarse:o=>{if(o!=='fallo')G.aliento+=o==='pleno'?2:1;},
  distraccion:o=>{if(o==='fallo'){panic(1);return;}if(G.beast.hidden)return;beastRetreat(o==='pleno'?3:2);G.beast.lost=1;markNoise(G.pos,'tú');},
  improvisar:()=>{G.flags.improv=true;},
  planificar:()=>{G.flags.plan=(G.flags.plan||0)+1;}
};
// recuperar la última carta pagando su coste (carta «Otra vez»)
function canRepeat(){return !busy()&&G.hand.includes('repetir')&&G.lastPlayed&&G.aliento>=CARDS[G.lastPlayed].c&&G.hand.length<HAND+1;}
function repeatCard(){if(!canRepeat())return;const id=G.lastPlayed;discardCard('repetir');G.aliento-=CARDS[id].c;G.used[id]=Math.max(0,(G.used[id]||1)-1);G.hand.push(id);G.lastPlayed=null;log(`Otra vez: «${CARDS[id].n}» vuelve a tu mano.`,'good');}

// ---------- registrar ----------
function takeItem(id){
  if(id==='acceso'){G.keys++;log(`Encuentras una tarjeta de acceso (${G.keys}).`,'good');return true;}
  if(G.inv.length>=MAXINV&&!PARTS.includes(id)){log(`Encuentras ${ITEMS[id].n}, pero no puedes cargar más. Lo dejas aquí.`,'bad');G.decks[G.pos].push(id);return false;}
  G.inv.push({id,uses:ITEMS[id].uses||0});log(`Encuentras: ${ITEMS[id].n}.`,'good');return true;
}
function doSearch(out){
  markNoise(G.pos,'tú');G.madeNoise=G.pos;G.searched[G.pos]=true;
  if(out==='fallo')G.loud=G.pos;
  const deck=G.decks[G.pos];
  if(!deck.length){log(`En ${R(G.pos)} no queda nada útil.`);return;}
  if(out==='pleno'&&deck.length>=2){const a=deck.pop(),b=deck.pop();G.choice={title:'¿Con qué te quedas?',kind:'search',opts:[a,b].map(v=>({v,l:v==='acceso'?'Tarjeta de acceso':ITEMS[v].n})),rest:[a,b]};return;}
  takeItem(deck.pop());
}
function choose(v){
  const c=G.choice;if(!c||!c.opts.some(o=>o.v===v))return;G.choice=null;
  if(c.kind==='search'){const other=c.rest.find((x,i)=>x!==v||c.rest.indexOf(v)!==i);takeItem(v);if(other)G.decks[G.pos].push(other);}
  if(c.kind==='rebuscar'){G.spent.splice(G.spent.indexOf(v),1);takeItem(v);}
  if(c.kind==='arrojar'){startCard('arrojar',{item:v});return;}
  check();
}

// ---------- moverse ----------
function canStep(to){
  if(busy()||!G.steps||G.steps.n<1)return null;
  if(G.blocked&&G.blocked.room===to)return null;
  if(CADJ[G.pos].includes(to))return 'corr';
  if(SADJ[G.pos].some(s=>s.to===to&&shaftOpen(s.i)))return 'shaft';
  if(VADJ[G.pos].includes(to)&&ventOpen(G.pos,to))return 'vent';
  return null;
}
function step(to){
  const how=canStep(to);if(!how)return;
  const safe=G.steps.safe;G.steps.n--;G.prevPos=G.pos;G.pos=to;UI.sel=to;
  if(how==='vent'){panic(1);const left=followers();left.forEach(c=>c.follow=false);log(`Te arrastras por el conducto hasta ${R(to)} (+1 Pánico)${left.length?'. Tus compañeros no caben y se quedan atrás':''}.`);}
  else{followers().forEach(c=>c.room=to);log(`${how==='shaft'?'Cruzas el conducto de mantenimiento':'Vas'} hasta ${R(to)}${followers().length?' con '+followers().map(c=>CREW[c.id].n).join(' y '):''}.`);}
  if(G.steps.n<1)G.steps=null;
  if(beastAt(to)){
    if(safe){log('Te cruzas con la criatura, pero consigues pasar sin que te toque.','good');}
    else{log('¡La criatura está aquí! Se lanza sobre ti.','bad');beginThreat('you',!!G.beast.ambush,'play');}
  }
  seeBeast();check();
}
function canInsertKey(i){return !busy()&&G.keys>0&&!shaftOpen(i)&&SHAFTS[i].includes(G.pos);}
function insertKey(i){if(!canInsertKey(i))return;G.keys--;G.shafts.push(i);const [a,b]=SHAFTS[i];log(`Insertas una tarjeta: se abre el conducto de mantenimiento ${R(a)} ↔ ${R(b)}.`,'good');}

// ---------- acciones de sala (cuestan Aliento) ----------
function spend(n){if(G.aliento<n)return false;G.aliento-=n;return true;}
function recruit(id){const c=G.crew.find(x=>x.id===id);if(busy()||!c||!c.alive||c.room!==G.pos||c.follow||followers().length>=MAXFOLLOW)return;c.follow=true;log(`${CREW[id].n} se une a ti.`,'good');}
function dismiss(id){const c=G.crew.find(x=>x.id===id);if(!c||!c.follow)return;c.follow=false;log(`${CREW[id].n} se queda en ${R(c.room)}.`);}
function assembleCost(){return hasCrew('okoye')?1:3;}
function canAssemble(){return !busy()&&G.pos==='ingenieria'&&PARTS.every(has)&&G.aliento>=assembleCost();}
function assemble(){if(!canAssemble())return;spend(assembleCost());PARTS.forEach(dropItem);G.cannon={charges:3};markNoise(G.pos,'tú');G.madeNoise=G.pos;log('Sueldas la última pieza. El cañón de plasma añade +2 de daño a tus ataques y te deja golpear desde una sala contigua (3 cargas).','good');}
function canRecharge(){return !busy()&&G.cannon&&G.cannon.charges<3&&G.pos==='reactor'&&G.aliento>=1;}
function recharge(){if(!canRecharge())return;spend(1);G.cannon.charges=3;log('Recargas el cañón en el reactor: 3 cargas.','good');}
function canScan(){return !busy()&&(G.pos==='puente'||G.pos==='control')&&G.aliento>=1;}
function scan(){
  if(!canScan())return;spend(1);
  if(G.beast.hidden){const far=Object.keys(ROOMS).filter(r=>distance(G.pos,r)>=2&&r!=='lanzadera');reappear(pick(far));log(`El escáner la obliga a moverse: aparece en ${R(G.beast.room)}.`,'good');}
  else log(`El escáner interno la localiza en ${R(G.beast.room)}.`,'good');
  G.flags.radar=true;seeBeast();
}
function canUse(id){
  if(busy()||!has(id))return false;
  if(id!=='adrenalina'&&G.aliento<1)return false;
  if(id==='botiquin')return G.hp<G.maxHp;
  if(id==='sedante')return G.panic>0;
  if(id==='bengala'||id==='adrenalina')return true;
  if(id==='soldador')return !G.welded.includes(G.pos)&&VADJ[G.pos].length>0;
  if(id==='lanzallamas')return beastAt(G.pos);
  return false;
}
function useItem(id){
  if(!canUse(id))return;
  if(id!=='adrenalina')spend(1);
  if(id==='botiquin'){heal(2);spendItem(id);log('Te vendas las heridas: +2 Salud.','good');}
  if(id==='sedante'){panic(-3);spendItem(id);log('Los sedantes te calman: −3 Pánico.','good');}
  if(id==='adrenalina'){G.aliento+=2;spendItem(id);log('Te inyectas adrenalina: +2 Aliento.','good');}
  if(id==='bengala'){G.decoy={room:G.pos,turns:3};spendItem(id);log(`Dejas una bengala encendida en ${R(G.pos)}.`,'good');}
  if(id==='soldador'){const it=item('soldador');it.uses--;G.welded.push(G.pos);if(it.uses<=0)spendItem('soldador');log(`Sellas los conductos de ${R(G.pos)}.`,'good');}
  if(id==='lanzallamas'){const it=item('lanzallamas');it.uses--;if(it.uses<=0){spendItem('lanzallamas');log('El lanzallamas se queda sin combustible.');}beastRetreat(2);log('Una lengua de fuego llena la sala. La criatura retrocede.','good');}
  seeBeast();
}
function drop(id){if(busy())return;const i=G.inv.findIndex(x=>x.id===id);if(i<0)return;const [it]=G.inv.splice(i,1);G.decks[G.pos].push(it.id);log(`Dejas ${ITEMS[it.id].n} en ${R(G.pos)}.`);}
function canAirlock(){return !busy()&&G.pos==='control'&&G.aliento>=1&&crewIn('bodega').length===0;}
function airlock(){
  if(!canAirlock())return;spend(1);
  if(beastAt('bodega')){log('Pulsas el botón. La compuerta se abre y la criatura sale despedida al vacío.','good');win('esclusa');return;}
  log('La esclusa se abre al vacío… pero en la bodega no había nada. La criatura ha oído el estruendo.','bad');markNoise('control','tú');G.madeNoise='control';
}
function destructTime(){return 4+(hasCrew('vega')?2:0);}
function canDestruct(){return !busy()&&G.pos==='puente'&&G.keys>=KEYS_DESTRUCT&&G.destruct===null&&G.aliento>=1;}
function destruct(){if(!canDestruct())return;spend(1);G.keys-=KEYS_DESTRUCT;G.destruct=destructTime();log(`Insertas ${KEYS_DESTRUCT} tarjetas de acceso en la consola del Puente. Autodestrucción en ${G.destruct} turnos. Corre a la lanzadera.`,'bad');panic(1);}
function canLaunch(){return !busy()&&G.pos==='lanzadera'&&G.destruct!==null&&G.aliento>=1&&!beastAt('lanzadera');}
function launch(){if(!canLaunch())return;spend(1);log('La lanzadera se separa. Detrás de ti, el Erebus se convierte en una estrella.','good');win('huida');}

// ---------- la criatura ----------
function humansAt(r){return (G.pos===r?1:0)+crewIn(r).length;}
function nearestHuman(onlyCrew){
  const {dist}=bfs(G.beast.room,'all',true);
  let best=null,bd=99;
  const cands=[...(onlyCrew?[]:[G.pos]),...G.crew.filter(c=>c.alive&&!c.follow).map(c=>c.room)];
  for(const r of cands){const d=dist[r]??99;if(d<bd){bd=d;best=r;}}
  return best||G.pos;
}
function beastStep(to,how){
  G.beast.room=to;
  if(CADJ[G.pos].includes(to)||VADJ[G.pos].includes(to)||to===G.pos)markNoise(to,how==='vent'?'conductos':'pasos');
}
function beastWander(steps,ventsOnly){
  if(G.beast.hidden)return;
  for(let i=0;i<steps;i++){const ns=neighbors(G.beast.room,ventsOnly?'vent':'all',true);if(!ns.length)return;beastStep(pick(ns),ventsOnly?'vent':'all');if(humansAt(G.beast.room))return;}
}
function beastRetreat(n){
  for(let i=0;i<n;i++){const ns=neighbors(G.beast.room,'all',true);if(!ns.length)return;ns.sort((a,b)=>distance(G.pos,b)-distance(G.pos,a));G.beast.room=ns[0];}
}
function reappear(room){G.beast.hidden=false;G.beast.room=room;}
function drawAmbush(){
  const side=G.beast.stage==='adulta'?'adulta':'joven';
  if(!G.ambushDeck.length)G.ambushDeck=shuffle(AMBUSH[side].map((_,i)=>i));
  const card=AMBUSH[side][G.ambushDeck.pop()];
  log(`Emboscada · ${card.h}: ${card.x}`,'bad');
  if(card.panic)panic(card.panic);
  if(!card.where)return null;
  let room=G.pos;
  if(card.where==='vent'){const vs=VADJ[G.pos].filter(v=>ventOpen(G.pos,v,true));room=vs.length?pick(vs):pick(CADJ[G.pos]);}
  if(card.where==='crew'){const free=G.crew.filter(c=>c.alive&&!c.follow);room=free.length?free.sort((a,b)=>distance(G.pos,a.room)-distance(G.pos,b.room))[0].room:G.pos;}
  if(card.where==='noise'){const n=[...G.noise].sort((a,b)=>b.turn-a.turn)[0];room=n?n.room:G.pos;}
  if(card.where==='far'){const {dist}=bfs(G.pos,'all',true);room=Object.keys(dist).sort((a,b)=>dist[b]-dist[a])[0];}
  reappear(room);log(`La criatura reaparece en ${R(room)}.`,'bad');
  return card.where==='you'||card.where==='crew'||card.where==='noise'?'attack':null;
}
// fase de la criatura. Devuelve true si se detiene esperando la reacción del jugador
function beastPhase(){
  const B=G.beast;
  if(B.hidden){const res=drawAmbush();if(res==='attack')return beastAttack(true);seeBeast();return false;}
  B.ambush=false;
  if(B.stun>0){B.stun--;log('La criatura se lame las heridas en algún lugar de la nave.');return false;}
  if(!G.instincts.length)G.instincts=shuffle([...INSTINCTS]);
  let ins=G.instincts.pop();
  if(ins==='desvanecerse'&&B.stage==='cria')ins='cazar';
  if(ins==='desvanecerse'){B.hidden=true;log('La pierdes de vista. Se ha desvanecido en las sombras de la nave.','bad');panic(1);return false;}
  if(ins==='rugido'){panic(1);markNoise(B.room,'chillido');log(`Un chillido recorre la nave desde ${R(B.room)}. +1 Pánico.`,'bad');return false;}
  if(ins==='emboscar'){B.ambush=true;log('Silencio. Demasiado silencio.');return false;}
  let tgt;
  if(G.decoy)tgt=G.decoy.room;
  else if(G.loud)tgt=G.loud;
  else if(G.madeNoise&&!B.lost&&distance(B.room,G.madeNoise)<=4)tgt=G.madeNoise;
  else tgt=nearestHuman(ins==='alimentarse'||B.lost>0);
  B.lost=0;
  const mode=ins==='acechar'?'vent':'all';
  const path=pathTo(B.room,tgt,mode,true)||pathTo(B.room,tgt,'all',true);
  if(path)for(let i=1;i<path.length&&i<=beastSpeed();i++){
    if(G.blocked&&G.blocked.room===path[i])break;
    const how=VADJ[path[i-1]].includes(path[i])&&!CADJ[path[i-1]].includes(path[i])?'vent':'corr';
    beastStep(path[i],how);
    if(humansAt(B.room))break;
  }
  return beastAttack(false);
}
function beastAttack(ambush){
  const B=G.beast;
  if(B.room===G.pos){log('La criatura se lanza sobre ti.','bad');return beginThreat('you',ambush,'end');}
  const victims=crewIn(B.room);
  if(victims.length){const v=pick(victims);return beginThreat(v.id,ambush,'end');}
  seeBeast();return false;
}
// un ataque pendiente: el jugador puede responder con cartas de Reacción o con el lanzallamas
function beginThreat(target,ambush,resume){
  const B=G.beast;G.lastSeen={room:B.room,turn:G.turn};
  const dmg=STAGES[B.stage].dmg+(ambush&&B.stage==='adulta'?1:0);
  G.threat={target,dmg,ambush,resume,reduce:0,ignore:false,minOne:false,counter:0,dodge:false,endPhase:false,shield:false};
  // si nadie puede ponerse delante del tripulante, el ataque se resuelve sin esperar y el turno sigue su curso
  if(target!=='you'&&!G.hand.some(h=>CARDS[h].crew)){G.threat.resume=null;resolveThreat();return false;}
  return true;
}
function canReact(id){const T=G.threat;if(!T||G.roll||G.choice||!G.hand.includes(id))return false;const d=CARDS[id];if(d.t!=='rea')return false;if(T.target!=='you')return !!d.crew;return !d.crew;}
function react(id){if(!canReact(id))return;startCard(id,{});}
function resolveReaction(id,out){
  const T=G.threat;if(!T)return;
  if(id==='proteger'){T.target='you';T.reduce+=out==='pleno'?2:out==='parcial'?1:0;resolveThreat();return;}
  if(id==='esquivar'){if(out==='fallo')panic(1);else{T.reduce+=out==='pleno'?2:1;T.dodge=true;}}
  if(id==='cubrirse'){if(out==='pleno')T.ignore=true;else if(out==='parcial')T.reduce+=2;else{T.reduce+=1;T.minOne=true;}}
  if(id==='contra'){if(out!=='fallo'){T.ignore=true;T.counter=out==='pleno'?2:1;}}
  if(id==='trampa'){T.ignore=true;T.counter=1;T.endPhase=true;}
  if(T.ignore)resolveThreat();
}
function useFlamer(){const T=G.threat;if(!T||T.target!=='you'||G.roll)return;const it=item('lanzallamas');if(!it||it.uses<=0)return;it.uses--;if(it.uses<=0){spendItem('lanzallamas');log('El lanzallamas se queda sin combustible.');}log('Disparas el lanzallamas a ciegas. La criatura retrocede entre chillidos.','good');T.ignore=true;T.flamed=true;resolveThreat();}
function resolveThreat(){
  const T=G.threat;if(!T)return;G.threat=null;
  const B=G.beast;
  if(T.target!=='you'){
    const v=G.crew.find(c=>c.id===T.target);
    if(v&&v.alive){v.alive=false;v.follow=false;panic(1);markNoise(B.room,'grito');feed(2,true);log(`Un grito desde ${R(B.room)}: ${CREW[v.id].n} ha muerto. +1 Pánico.`,'bad');}
  } else if(T.ignore){
    log('El ataque no te alcanza.','good');
  } else {
    let dmg=Math.max(T.minOne?1:0,T.dmg-T.reduce);
    if(dmg>0){G.hp-=dmg;panic(1);feed(1,true);log(`Te alcanza: −${dmg} Salud, +1 Pánico.`,'bad');}
    else log('Absorbes el golpe sin daño.','good');
  }
  if(T.dodge&&G.phase!=='over'){const ns=CADJ[G.pos].filter(n=>n!==B.room&&!(G.blocked&&G.blocked.room===n));if(ns.length){const to=pick(ns);G.pos=to;UI.sel=to;followers().forEach(c=>c.room=to);log(`Te apartas hasta ${R(to)}.`,'good');}}
  if(T.flamed)beastRetreat(2);
  check();if(G.phase==='over')return;
  if(T.counter)hurtBeast(T.counter);
  if(G.phase==='over')return;
  if(T.endPhase){B.stun=1;log('La trampa la deja aturdida.','good');}
  if(T.resume==='end')finishEndTurn();
}
function crewWander(){
  for(const c of G.crew){
    if(!c.alive||c.follow)continue;
    if(Math.random()<0.35){const ns=CADJ[c.room].filter(n=>!beastAt(n)&&!(G.blocked&&G.blocked.room===n));if(ns.length)c.room=pick(ns);}
  }
}
function endTurn(){
  if(busy())return;
  G.phase='beast';G.steps=null;G.flags.improv=false;
  const waiting=beastPhase();
  if(G.phase==='over')return;
  if(waiting&&G.threat)return;
  finishEndTurn();
}
function finishEndTurn(){
  if(G.phase==='over')return;
  crewWander();
  if(G.decoy){G.decoy.turns--;if(G.decoy.turns<=0){G.decoy=null;log('La bengala se apaga.');}}
  G.madeNoise=null;G.loud=null;
  if(G.destruct!==null){
    G.destruct--;
    // morir junto a la criatura no cuenta como victoria
    if(G.destruct<=0){log('La cuenta atrás llega a cero.','bad');lose('explosion');return;}
    log(`Autodestrucción en ${G.destruct} turnos.`,'bad');
  }
  G.phase='play';
  startTurn();
}

// ---------- dibujo ----------
function mapHTML(){
  const W=26,H=11;
  const corr=CORR.map(([a,b])=>`<line class="corr" x1="${ROOMS[a].x}" y1="${ROOMS[a].y}" x2="${ROOMS[b].x}" y2="${ROOMS[b].y}"/>`).join('');
  const curve=(a,b,off)=>{const A=ROOMS[a],B=ROOMS[b],mx=(A.x+B.x)/2,my=(A.y+B.y)/2,dx=B.x-A.x,dy=B.y-A.y,l=Math.hypot(dx,dy)||1;
    let ox=-dy/l*off,oy=dx/l*off;if((mx+ox-50)*(mx-50)<0||Math.abs(mx+ox-50)<Math.abs(mx-50)){ox=-ox;oy=-oy;}return {d:`M${A.x} ${A.y}Q${(mx+ox).toFixed(1)} ${(my+oy).toFixed(1)} ${B.x} ${B.y}`,cx:mx+ox/2,cy:my+oy/2};};
  const vents=VENTS.map(([a,b])=>`<path class="vent${ventOpen(a,b)?'':' sealed'}" d="${curve(a,b,9).d}"/>`).join('');
  const shafts=SHAFTS.map(([a,b],i)=>{const c=curve(a,b,-6),o=shaftOpen(i);return `<path class="shaft${o?' open':''}" d="${c.d}"/><text class="shaft-k${o?' open':''}" x="${c.cx.toFixed(1)}" y="${c.cy.toFixed(1)}" text-anchor="middle">${o?'M'+(i+1):'⌧'+(i+1)}</text>`;}).join('');
  const vis=visible();
  const rooms=Object.entries(ROOMS).map(([id,r])=>{
    const x=r.x-W/2,y=r.y-H/2;
    const adj=G.phase==='play'&&!!canStep(id);
    const cls=['room',id===G.pos?'here':'',UI.sel===id?'sel':'',adj?'adj':'',G.blocked&&G.blocked.room===id?'blocked':''].join(' ');
    const tags=[];
    if(G.welded.includes(id))tags.push('SELLADO');
    if(G.blocked&&G.blocked.room===id)tags.push('VAPOR');
    if(G.searched[id])tags.push(G.decks[id].length?'REGISTRADA':'VACÍA');
    let marks='';
    if(id===G.pos)marks+=`<path class="me" d="M${x+3} ${y+H-1.6}l1.6-3 1.6 3z"/>`;
    crewIn(id).forEach((c,i)=>{const cx=x+8+i*3.2,cy=y+H-2.5;marks+=`<circle class="crew" cx="${cx}" cy="${cy}" r="1.25"/><text class="crew-l" x="${cx}" y="${cy+.6}" text-anchor="middle">${CREW[c.id].n[0]}</text>`;});
    if(G.decoy&&G.decoy.room===id)marks+=`<path class="decoy" d="M${x+W-4} ${y+1.6}l.7 1.5 1.6.2-1.2 1.1.3 1.6-1.4-.8-1.4.8.3-1.6-1.2-1.1 1.6-.2z"/>`;
    if(vis&&G.beast.room===id)marks+=`<path class="beast" d="M${x+W-4.2} ${y+H-1.4}q-1.8-3.2 0-4.6 1 1.2 1.8.2.8 1 1.8-.2 1.8 1.4 0 4.6z"/>`;
    else if(!vis&&G.lastSeen&&G.lastSeen.room===id&&G.turn-G.lastSeen.turn<=3)marks+=`<rect class="ghost" x="${x+W-5.6}" y="${y+H-5.2}" width="4" height="4" rx="2"/>`;
    const nz=G.noise.find(n=>n.room===id&&n.kind!=='tú');
    const ring=nz?`<rect class="noise" x="${x-1}" y="${y-1}" width="${W+2}" height="${H+2}" rx="1"/>`:'';
    return `<g class="${cls}" data-a="sel" data-u="${id}" tabindex="0" role="button" aria-label="${esc(r.n)}">
      ${ring}<rect class="bg" x="${x}" y="${y}" width="${W}" height="${H}" rx=".5"/>
      <text class="nm" x="${r.x}" y="${y+3.6}" text-anchor="middle">${esc(r.n)}</text>
      <text class="tag${nz?' warn':''}" x="${r.x}" y="${y+6}" text-anchor="middle">${nz?'RUIDO: '+nz.kind.toUpperCase():tags.join(' · ')}</text>
      ${marks}
    </g>`;}).join('');
  return `<div class="mapwrap"><svg class="map" viewBox="-2 -1 104 112" role="group" aria-label="Plano del Erebus">
    <path class="hull" d="M50 -0.5L96 14V96L50 111L4 96V14Z"/>${corr}${vents}${shafts}${rooms}</svg></div>`;
}
function roomPanel(){
  const id=UI.sel||G.pos,r=ROOMS[id],here=id===G.pos;
  const people=crewIn(id),vis=visible(),beastHere=vis&&G.beast.room===id;
  const acts=[];
  if(here){
    for(const c of people)if(!c.follow)acts.push(`<button class="btn cyan" data-a="recruit" data-u="${c.id}" ${followers().length<MAXFOLLOW&&!busy()?'':'disabled'}>Que ${esc(CREW[c.id].n)} te siga</button>`);
    SHAFTS.forEach(([a,b],i)=>{if((a===id||b===id)&&!shaftOpen(i))acts.push(`<button class="btn" data-a="key" data-u="${i}" ${canInsertKey(i)?'':'disabled'}>Abrir conducto hacia ${esc(R(a===id?b:a))} · 1 tarjeta</button>`);});
    if(id==='ingenieria'&&!G.cannon)acts.push(`<button class="btn solid" data-a="assemble" ${canAssemble()?'':'disabled'}>Montar cañón · ${assembleCost()} Aliento</button>`);
    if(id==='reactor'&&G.cannon)acts.push(`<button class="btn" data-a="recharge" ${canRecharge()?'':'disabled'}>Recargar cañón · 1 Aliento</button>`);
    if(id==='puente'||id==='control')acts.push(`<button class="btn cyan" data-a="scan" ${canScan()?'':'disabled'}>Escáner interno · 1 Aliento</button>`);
    if(id==='puente'&&G.destruct===null)acts.push(`<button class="btn alert" data-a="destruct" ${canDestruct()?'':'disabled'}>Autodestrucción · ${KEYS_DESTRUCT} tarjetas y 1 Aliento</button>`);
    if(id==='control')acts.push(`<button class="btn alert solid" data-a="airlock" ${canAirlock()?'':'disabled'}>Abrir la esclusa de la bodega · 1 Aliento</button>`);
    if(id==='lanzadera')acts.push(`<button class="btn alert solid" data-a="launch" ${canLaunch()?'':'disabled'}>Despegar · 1 Aliento</button>`);
  } else {
    const how=canStep(id);
    const link=CADJ[G.pos].includes(id)?'pasillo':SADJ[G.pos].some(s=>s.to===id&&shaftOpen(s.i))?'conducto de mantenimiento':VADJ[G.pos].includes(id)?'conducto (+1 Pánico)':null;
    if(link)acts.push(`<button class="btn solid" data-a="step" data-u="${id}" ${how?'':'disabled'}>Ir por ${link} · 1 paso</button>`);
    else acts.push(`<span class="empty">No está junto a tu sala.</span>`);
  }
  const notes=[];
  if(here)notes.push('Estás aquí.');
  if(beastHere)notes.push('<span class="warn">La criatura está en esta sala.</span>');
  if(people.length)notes.push(`Tripulación: ${people.map(c=>CREW[c.id].n+(c.follow?' (te sigue)':'')).join(', ')}.`);
  if(G.searched[id])notes.push(G.decks[id].length?'Aún queda algo por encontrar.':'Ya no queda nada útil.');
  else if(id!=='lanzadera')notes.push('Sin registrar.');
  if(id==='control')notes.push(crewIn('bodega').length?'<span class="warn">Hay tripulantes en la bodega: no puedes abrir la esclusa.</span>':'La esclusa expulsa al espacio todo lo que haya en la Bodega.');
  if(id==='puente'&&G.destruct===null)notes.push(`La autodestrucción necesita ${KEYS_DESTRUCT} tarjetas de acceso (tienes ${G.keys}).`);
  if(id==='lanzadera'&&G.destruct===null)notes.push('Solo despegarás cuando la nave vaya a estallar.');
  if(id==='ingenieria'&&!G.cannon)notes.push(`Piezas del cañón: ${PARTS.filter(has).length}/3.`);
  if(!here&&!G.steps)notes.push('<span class="warn">Para moverte necesitas pasos: juega una carta de Movimiento.</span>');
  return `<div class="roompanel"><h3>${esc(r.n)}</h3><p class="meta">${notes.join(' ')}</p><div class="controls">${acts.join('')}</div></div>`;
}
function cardHTML(id,mode){
  const d=CARDS[id];
  let btn='';
  if(mode==='cat'){const left=copiesLeft(id);btn=`<span class="left">${left}/${d.q} disponibles</span><button class="btn" data-a="prep" data-u="${id}" ${canPrepare(id)?'':'disabled'}>Preparar · ${d.c}</button>`;}
  if(mode==='hand'){
    if(d.t==='rea')btn=G.threat?`<button class="btn alert solid" data-a="react" data-u="${id}" ${canReact(id)?'':'disabled'}>Reaccionar</button>`:'<span class="left">Se juega cuando la criatura ataca</span>';
    else if(id==='pelos')btn=G.roll?`<button class="btn solid" data-a="reroll" ${!G.roll.rerolled?'':'disabled'}>Repetir fallados</button>`:'<span class="left">Se juega tras una tirada</span>';
    else if(id==='repetir')btn=`<button class="btn" data-a="repeat" ${canRepeat()?'':'disabled'}>${G.lastPlayed?`Recuperar «${esc(CARDS[G.lastPlayed].n)}» · ${CARDS[G.lastPlayed].c}`:'Sin carta que recuperar'}</button>`;
    else btn=`<button class="btn solid" data-a="play" data-u="${id}" ${canPlay(id)?'':'disabled'}>Jugar</button>`;
  }
  const o=d.o;
  const res=d.roll?`<dl><dt class="p">2+</dt><dd>${esc(o[0])}</dd><dt class="h">1</dt><dd>${esc(o[1])}</dd><dt class="f">0</dt><dd>${esc(o[2])}</dd></dl>`:`<dl><dt class="p">▸</dt><dd>${esc(o[0])}</dd></dl>`;
  const na=mode==='cat'&&copiesLeft(id)<=0;
  return `<div class="card t-${d.t}${na?' na':''}"><div class="ct"><b>${esc(d.n)}</b><span class="cost">${d.c}◆</span></div><span class="ck">${KIND[d.t]}${d.roll?' · tirada':''}${d.ends?' · acaba el turno':''}${d.range?' · alcance '+d.range:''}</span>${res}<div class="controls">${btn}</div></div>`;
}
function rollHTML(){
  const r=G.roll;if(!r)return '';
  const t=target(),out=outcomeOf(r),d=CARDS[r.id],k=['pleno','parcial','fallo'].indexOf(out);
  return `<div class="rollbox"><h3>Tirada de Nervio · ${esc(d.n)}</h3>
    <div class="dice">${r.dice.map(x=>`<span class="die${x>=t?' ok':''}">${x}</span>`).join('')}</div>
    <p class="outcome">${successes(r)} éxito${successes(r)===1?'':'s'} (${t}+${G.flags.plan?`, +${G.flags.plan} por Planificar`:''}): <b class="${out}">${out}</b> — ${esc(d.o[k])}</p>
    <div class="controls"><button class="btn solid big" data-a="accept">Aceptar</button>${G.hand.includes('pelos')&&!r.rerolled?'<button class="btn" data-a="reroll">Por los pelos: repetir fallados</button>':''}</div></div>`;
}
function threatHTML(){
  const T=G.threat;if(!T||G.roll)return '';
  const who=T.target==='you'?'ti':CREW[T.target].n;
  const reacts=G.hand.filter(h=>canReact(h));
  const fl=T.target==='you'&&item('lanzallamas');
  return `<div class="threat"><h3>¡Ataque!</h3><p>La criatura (${STAGES[G.beast.stage].n.toLowerCase()}) va a por ${esc(who)}${T.ambush?' por sorpresa':''}: ${T.target==='you'?`${T.dmg} de daño${T.reduce?` (−${T.reduce})`:''}`:'lo matará'}.</p>
    <div class="controls">${reacts.map(h=>`<button class="btn alert solid" data-a="react" data-u="${h}">${esc(CARDS[h].n)}</button>`).join('')}${fl?'<button class="btn alert" data-a="flamer">Lanzallamas</button>':''}<button class="btn" data-a="take">${T.target==='you'?'Aguantar el golpe':'No puedes hacer nada'}</button></div></div>`;
}
function choiceHTML(){const c=G.choice;if(!c)return '';return `<div class="choice"><h3>${esc(c.title)}</h3><div class="controls">${c.opts.map(o=>`<button class="btn solid" data-a="choose" data-u="${o.v}">${esc(o.l)}</button>`).join('')}</div></div>`;}
function invHTML(){
  const items=G.inv.map(it=>{
    const d=ITEMS[it.id],usable=['botiquin','sedante','adrenalina','bengala','soldador','lanzallamas'].includes(it.id);

      <div class="controls">${usable?`<button class="btn" data-a="use" data-u="${it.id}" ${canUse(it.id)?'':'disabled'}>Usar${it.id==='adrenalina'?'':' · 1'}</button>`:''}<button class="btn cyan" data-a="drop" data-u="${it.id}" ${busy()?'disabled':''}>Soltar</button></div></div>`;

  if(G.cannon)items.unshift(`<div class="item part"><b>Cañón de plasma · ${G.cannon.charges} cargas</b><span>Cada ataque que acierta gasta 1 carga y hace +2 de daño. Te deja atacar desde una sala contigua por pasillo.</span></div>`);
  items.unshift(`<div class="item"><b>Tarjetas de acceso · ${G.keys}</b><span>Abren conductos de mantenimiento (gratis). Con ${KEYS_DESTRUCT} activas la autodestrucción en el Puente.</span></div>`);

function hint(){
  if(G.threat)return 'La criatura ataca. Responde con una carta de Reacción o aguanta el golpe.';
  if(G.roll)return 'Mira la tirada y acéptala, o repítela si tienes «Por los pelos».';
  if(G.choice)return 'Elige una opción.';
  if(G.destruct!==null)return `La nave estalla en ${G.destruct} turnos. Llega a la Lanzadera y despega.`;
  if(G.steps)return `Te quedan ${G.steps.n} paso${G.steps.n===1?'':'s'}: toca una sala con borde ámbar y muévete.`;
  return 'Prepara cartas con tu Aliento y juégalas. Para moverte, juega una carta de Movimiento y gasta los pasos en el plano.';
}
function sedHTML(){const B=G.beast;return `<span class="sed" title="Sed">${Array.from({length:SED_MAX},(_,i)=>`<i class="${i<B.sed?'on':''}${SED_EVOLVE[i+1]?' evo':''}"></i>`).join('')}</span>`;}
function rulesHTML(){
  return `<details class="rules"><summary>Cómo se juega</summary><div class="rules-body">
    <p>Eres la última persona despierta en el carguero minero Erebus. Algo salió del Laboratorio y todavía es pequeño. No lo será mucho tiempo.</p>
    <h3>Aliento y cartas</h3>
    <ul>
      <li>Cada turno tienes <b>6 de Aliento</b> (4 si tu Pánico llega a 7). Con él <b>preparas</b> cartas del catálogo pagando su coste y las llevas en la mano (máximo 5). La mano se conserva entre turnos.</li>
      <li>Cada carta tiene copias limitadas. Las que juegas vuelven al catálogo al empezar el turno siguiente.</li>
      <li>El Aliento también paga las acciones de sala (escáner, esclusa, montar el cañón…) y el uso de objetos.</li>
      <li>Para <b>moverte</b> juega una carta de Movimiento: te da pasos para recorrer el plano.</li>
    </ul>
    <h3>Tirada de Nervio</h3>
    <ul>
      <li>Tiras 4 dados, uno menos por cada 3 de Pánico. Cada 5 o 6 es un éxito (con «Improvisar», también el 4).</li>
      <li>2 éxitos o más: <b>pleno</b>. 1 éxito: <b>parcial</b>. Ninguno: <b>fallo</b>. Cada carta indica qué pasa en cada caso.</li>
      <li>«Por los pelos» repite los dados fallados y «Otra vez» devuelve a tu mano la carta que acabas de jugar.</li>
    </ul>
    <h3>La criatura</h3>
    <ul>
      <li>Crece en tres fases: <b>cría</b>, <b>juvenil</b> y <b>adulta</b>. Avanza con su <b>Sed</b>: al herirte (+1), al matar a un tripulante (+2) y, desde juvenil, por hambre cada 3 turnos. Mientras es cría solo cuenta lo que caza ella misma.</li>
      <li>De juvenil en adelante puede <b>desvanecerse</b>: desaparece del plano y cada turno se revela una <b>emboscada</b> que decide dónde reaparece. De adulta, la baraja cambia por otra peor.</li>
      <li>Al hacerse adulta su Vida sube mucho y se cura del todo, se mueve el doble y atraviesa los conductos sellados.</li>
      <li>Hace 1, 2 o 3 de daño según su fase. Cuando ataca puedes responder con cartas de <b>Reacción</b> preparadas o con el lanzallamas.</li>
      <li>El <b>escáner interno</b> (Puente o Control) te dice dónde está y la obliga a mostrarse si está oculta.</li>
    </ul>
    <h3>La nave</h3>
    <ul>
      <li>Al registrar puedes encontrar <b>tarjetas de acceso</b>. Usarlas no cuesta Aliento.</li>
      <li>Hay cuatro <b>conductos de mantenimiento</b> cerrados (líneas moradas). Insertando una tarjeta en una de sus salas lo abres y puedes cruzarlo con tu tripulación. La criatura siempre puede usarlos.</li>
      <li>Los conductos de ventilación se pueden cruzar con +1 de Pánico, pero tus compañeros no caben.</li>
    </ul>
    <h3>Cómo ganar</h3>
    <ul>
      <li><b>Abatirla:</b> quítale toda la Vida con cartas de Ataque. El cañón de plasma (Célula del Reactor, Bobina del Laboratorio y Carcasa de la Armería, montado en Ingeniería) añade +2 de daño y alcance.</li>
      <li><b>La esclusa:</b> atráela a la Bodega y abre la esclusa desde el Control.</li>
      <li><b>Autodestrucción:</b> con 4 tarjetas de acceso, actívala en el Puente y despega desde la Lanzadera antes de que acabe la cuenta atrás. Si la nave estalla contigo dentro pierdes, aunque la criatura muera también.</li>
    </ul>
    <h3>Derrota</h3>
    <ul><li>Pierdes si tu Salud llega a 0, si tu Pánico llega a 10, si se acaba el soporte vital o si la nave estalla contigo dentro.</li></ul>
  </div></details>`;
}
function titleHTML(){

      <p>Despiertas antes de tiempo en la cápsula de criogenia. Las luces de emergencia parpadean y el ordenador repite el mismo aviso: contención fallida en el Laboratorio. Algo pequeño se mueve por los conductos. Está creciendo.</p></div>

function endHTML(){
  const r=G.result;
  if(r.win){
    const v=r.total>=26?'La compañía te ofrece un ascenso a cambio de tu silencio.':r.total>=17?'Sobrevives. Durante años despertarás a oscuras, escuchando los conductos.':'Lo has conseguido, aunque no quieres recordar a qué precio.';

      <table>${r.rows.map(([k,n])=>`<tr><td>${esc(k)}</td><td>${n>0?'+':''}${n}</td></tr>`).join('')}<tr class="total"><td>Puntuación</td><td>${r.total}</td></tr></table>
      <p class="verdict">${DIFF[G.diff].n} · ${G.turn} turnos</p>
      <button class="btn solid big" data-a="again">Jugar otra vez</button></div></div>`;

    oxigeno:'El soporte vital se apaga. Lo último que oyes es algo que respira detrás de la pared.',explosion:'El Erebus estalla contigo a bordo. La criatura muere también, pero eso no es sobrevivir.'}[r.reason];
  const head={muerte:'Muerte',panico:'Pánico',oxigeno:'Sin oxígeno',explosion:'Demasiado tarde'}[r.reason];
  return `<div class="overlay"><div class="end lost" role="dialog" aria-label="Resultado"><div class="mast">Registro final · Erebus</div>
    <h2>${head}</h2><p class="verdict">${esc(txt)}</p><p class="verdict">Aguantaste ${G.turn} turnos. La criatura era ${STAGES[G.beast.stage].n.toLowerCase()} y le quedaban ${Math.max(0,G.beast.hp)} de ${G.beast.maxHp} de Vida.</p>
    <button class="btn solid big" data-a="again">Intentarlo de nuevo</button></div></div>`;
}

const HAS_DOM=typeof document!=='undefined';
const KEY='erebus-protocolos';
function save(){try{if(G)localStorage.setItem(KEY,JSON.stringify(G));else localStorage.removeItem(KEY);}catch(e){}}
function render(){if(!HAS_DOM)return;document.getElementById('app').innerHTML=G?boardHTML():titleHTML();save();}
function handle(a,u){
  switch(a){
    case 'diff':UI.diff=u;break;
    case 'start':newGame(UI.diff);break;
    case 'sel':UI.sel=u;break;
    case 'step':step(u);break;
    case 'key':insertKey(+u);break;
    case 'prep':prepare(u);break;
    case 'play':play(u);break;
    case 'accept':acceptRoll();break;
    case 'reroll':rerollFailed();break;
    case 'repeat':repeatCard();break;
    case 'choose':choose(u);break;
    case 'react':react(u);break;
    case 'flamer':useFlamer();break;
    case 'take':resolveThreat();break;
    case 'recruit':recruit(u);break;
    case 'dismiss':dismiss(u);break;
    case 'assemble':assemble();break;
    case 'recharge':recharge();break;
    case 'scan':scan();break;
    case 'use':useItem(u);break;
    case 'drop':drop(u);break;
    case 'airlock':airlock();break;
    case 'destruct':destruct();break;
    case 'launch':launch();break;
    case 'end':endTurn();break;
    case 'askquit':UI.confirmQuit=true;break;
    case 'noquit':UI.confirmQuit=false;break;
    case 'quit':case 'again':G=null;UI.confirmQuit=false;break;
  }
}
if(HAS_DOM){
  const app=document.getElementById('app');
  app.addEventListener('click',e=>{
    const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
    const wasTitle=!G;handle(b.dataset.a,b.dataset.u);render();
    if(wasTitle&&G)window.scrollTo(0,0);
  });
  app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[data-a]')){e.preventDefault();handle('sel',e.target.dataset.u);render();}});
  const boot=data=>{
    if(data&&data.G)G=data.G;
    else{try{const s=localStorage.getItem(KEY);if(s){const g=JSON.parse(s);if(g&&g.phase!=='over'&&g.hand)G=g;}}catch(e){}}
    if(G&&!UI.sel)UI.sel=G.pos;
    render();
  };
  try{window.claude?.hot?.snapshot?.(()=>({G}));}catch(e){}
  window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
}
</script>
