<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Marea de Innsmouth</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+SC:wght@500;700&display=swap">
<style>
:root{
  /* Layout: un puerto de noche — el Muelle con los horrores arriba, la Biblioteca (mercado) en medio, tu mano abajo como sobre una mesa de trabajo; crónica a un lado */
  --night:#0d1117;
  --slate:#151c25;
  --slate-2:#1c2531;
  --rim:#2c3848;
  --fog:#d3d6d2;
  --muted:#8b95a1;
  --sodium:#e0a64a;
  --sodium-deep:#7a5520;
  --copper:#4f9a8e;
  --copper-deep:#24504a;
  --blood:#c0503f;
  --paper:#e2dccb;
  --paper-ink:#1f2328;
  --paper-soft:#5b5e5f;
  --t-tomo:#7a4f2a;
  --t-aliado:#2f5a72;
  --t-arma:#6d6d73;
  --t-hechizo:#5d3a6b;
  --t-objeto:#7c6324;
  --t-basica:#4a5560;
  --t-pesadilla:#2b2230;
  --display:'Grenze Gotisch','UnifrakturMaguntia',Georgia,serif;
  --label:'Alegreya SC','Alegreya',Georgia,serif;
  --body:'Alegreya',Georgia,'Times New Roman',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--night);
  background-image:radial-gradient(ellipse 90% 60% at 80% -10%, rgba(224,166,74,.10) 0%, transparent 60%),
                   radial-gradient(ellipse 120% 60% at 30% 110%, rgba(79,154,142,.12) 0%, transparent 70%);
  background-attachment:fixed;
  color:var(--fog);font-family:var(--body);font-size:16px;line-height:1.45;
}
#app{
  max-width:1320px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:16px 48px;
}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sodium);outline-offset:2px}

.btn{
  font-family:var(--label);font-size:14px;letter-spacing:.03em;
  border:1px solid var(--rim);background:var(--slate-2);color:var(--fog);
  padding:7px 14px;border-radius:2px;cursor:pointer;transition:background .15s,border-color .15s;
}
.btn:hover:not(:disabled){border-color:var(--sodium);background:#232d3a}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.primary{background:var(--sodium-deep);border-color:var(--sodium);color:#fff4df}
.btn.primary:hover:not(:disabled){background:#946827}
.btn.sea{background:var(--copper-deep);border-color:var(--copper);color:#e8f6f2}
.btn.sea:hover:not(:disabled){background:#2e6760}
.btn.danger{border-color:var(--blood);color:#f3cbc4}
.btn.big{font-size:16px;padding:10px 20px}

/* ---------- portada ---------- */
.title{display:grid;gap:26px;padding-block:20px}
.hero{display:grid;gap:12px;max-width:64ch}
.hero .eyebrow{font-family:var(--label);color:var(--copper);letter-spacing:.08em;font-size:14px}
.hero h1{font-family:var(--display);font-size:clamp(52px,11vw,112px);line-height:.9;color:var(--fog)}
.hero h1 span{color:var(--sodium)}
.hero p{color:#b9bfc4;font-size:17px}
.pick h2{font-family:var(--label);font-size:18px;color:var(--paper);margin-bottom:10px;letter-spacing:.04em}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.opt{text-align:left;display:grid;gap:4px;padding:14px 16px;cursor:pointer;background:var(--slate);border:1px solid var(--rim);border-radius:2px}
.opt:hover{border-color:var(--sodium)}
.opt[aria-pressed="true"]{border-color:var(--sodium);background:#221d14;box-shadow:inset 0 0 0 1px var(--sodium)}
.opt b{font-family:var(--label);font-weight:500;font-size:17px;color:var(--paper)}
.opt span{font-size:14px;color:#c3c7cb}
.start-row{display:flex;flex-wrap:wrap;gap:12px}

details.rules{border:1px solid var(--rim);border-radius:2px;background:var(--slate)}
details.rules summary{cursor:pointer;padding:10px 14px;font-family:var(--label);font-size:16px;color:var(--paper)}
.rules-body{padding:0 16px 16px;display:grid;gap:10px;max-width:74ch;font-size:15px}
.rules-body h3{font-family:var(--label);font-size:15px;color:var(--sodium);margin-top:6px}
.rules-body ul{margin:0;padding-left:20px;display:grid;gap:4px}

/* ---------- barra superior ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-bottom:12px;border-bottom:1px solid var(--rim);margin-bottom:14px}
.brand{font-family:var(--display);font-size:34px;line-height:1}
.brand span{color:var(--sodium)}
.stats{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.stat{display:grid;gap:3px}
.stat .lbl{font-family:var(--label);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.stat .val{font-family:var(--label);font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.bar{display:flex;gap:2px;align-items:center}
.seg{width:9px;height:14px;background:transparent;border:1px solid var(--copper)}
.seg.on{background:var(--copper)}
.bar.low .seg.on{background:var(--blood);border-color:var(--blood)}
.bar.doom .seg{border-color:#5c2c26}
.bar.doom .seg.on{background:var(--blood);border-color:var(--blood)}
.num{font-family:var(--label);font-size:14px;margin-left:6px;font-variant-numeric:tabular-nums}

/* ---------- mesa ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.board{display:grid;gap:14px;min-width:0}
.zone{border:1px solid var(--rim);border-radius:3px;padding:12px 14px;background:rgba(21,28,37,.78);display:grid;gap:10px;min-width:0}
.zone.muelle{background:linear-gradient(180deg,rgba(79,154,142,.12),rgba(21,28,37,.8));border-color:#2f4e52}
.zone.mano{background:linear-gradient(0deg,rgba(224,166,74,.08),rgba(21,28,37,.8));border-color:#4a3e2a}
.zone-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.zone-head h2{font-family:var(--display);font-size:28px;line-height:1;color:var(--paper)}
.zone-head .sub{font-size:14px;color:var(--muted);font-style:italic}
.row{display:flex;flex-wrap:wrap;gap:10px}
.empty{color:var(--muted);font-style:italic;font-size:15px;padding:6px 0}
.pool{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.res{display:flex;align-items:baseline;gap:8px;font-family:var(--label)}
.res b{font-size:30px;line-height:1;font-weight:500;font-variant-numeric:tabular-nums}
.res.saber b{color:var(--sodium)}
.res.vol b{color:#86c9bc}
.res span{font-size:13px;color:var(--muted);letter-spacing:.08em}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hint{font-style:italic;color:#d9cfb8;font-size:15px}
.played{display:flex;flex-wrap:wrap;gap:6px}
.mini{font-family:var(--label);font-size:12.5px;padding:3px 8px;border-radius:2px;background:var(--slate-2);border-left:3px solid var(--tc);color:#c9cdd1}

/* ---------- cartas ---------- */
.card{
  width:clamp(134px,30vw,152px);display:flex;flex-direction:column;
  background:var(--paper);color:var(--paper-ink);
  background-image:linear-gradient(170deg,rgba(255,255,255,.22),transparent 45%),
                   repeating-linear-gradient(0deg,rgba(0,0,0,.025) 0 1px,transparent 1px 4px);
  border-radius:4px;border:1px solid #8f8a7a;overflow:hidden;
  box-shadow:0 2px 0 rgba(0,0,0,.4),0 8px 16px rgba(0,0,0,.35);
  transition:transform .18s ease,box-shadow .18s ease;
}
.card .head{background:var(--tc);color:#f5f1e6;padding:5px 8px 6px;display:grid;gap:1px}
.card .kind{font-family:var(--label);font-size:10.5px;letter-spacing:.14em;opacity:.85}
.card .name{font-family:var(--label);font-size:15px;line-height:1.1;font-weight:500;min-height:33px;text-wrap:balance}
.card .art{display:grid;place-items:center;margin:7px 8px 4px;height:76px;border-radius:3px;color:#f6eedb;position:relative;overflow:hidden;
  background:radial-gradient(ellipse 70% 85% at var(--hx,50%) 25%,rgba(255,236,200,.34),transparent 70%),linear-gradient(170deg,var(--tc),#14181d 125%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),inset 0 -14px 22px rgba(0,0,0,.32)}
.card .art::after{content:"";position:absolute;inset:4px;border:1px solid rgba(246,238,219,.2);border-radius:2px;pointer-events:none}
.card .art svg{width:56px;height:56px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.card .txt{font-size:13px;line-height:1.3;padding:2px 9px 8px;flex:1}
.card .txt em{color:#8a2f25;font-style:normal;font-weight:600}
.card .foot{display:flex;justify-content:space-between;align-items:center;padding:5px 8px 7px;border-top:1px dashed rgba(31,35,40,.22)}
.cost{font-family:var(--label);font-size:15px;min-width:28px;height:28px;padding:0 6px;border-radius:14px;display:grid;place-items:center;background:var(--paper-ink);color:var(--sodium);font-variant-numeric:tabular-nums}
.vp{font-family:var(--label);font-size:13px;color:var(--paper-soft)}
.card .acts{display:grid;gap:5px;padding:0 7px 8px}
.card .btn{font-size:13px;padding:5px 6px;width:100%;background:#f3eedf;border-color:#a59f8b;color:var(--paper-ink)}
.card .btn:hover:not(:disabled){background:#fffaf0;border-color:var(--paper-ink)}
.card .btn.primary{background:var(--sodium-deep);border-color:#5a3e14;color:#fff4df}
.card .btn.primary:hover:not(:disabled){background:#946827}
.card.playable{cursor:pointer}
.card.playable:hover{transform:translateY(-3px);transition:transform .12s}
@media (prefers-reduced-motion:reduce){.card.playable:hover{transform:none}}
.card.pesadilla{background:#2a2430;color:#cfc4d6;border-color:#4b3d55;background-image:radial-gradient(ellipse at 50% 40%,rgba(160,110,190,.18),transparent 70%)}
.card.pesadilla .foot{border-top-color:rgba(207,196,214,.2)}
.card.pesadilla .vp{color:#cfc4d6}
.card.pesadilla .art{color:#ead6f5;background:radial-gradient(circle at 50% 50%,rgba(190,140,230,.38),transparent 70%),#1b1520}

/* horrores */
.horror{
  width:clamp(150px,30vw,176px);display:flex;flex-direction:column;
  background:#101a1c;color:#d3e0dc;border:1px solid #31514f;border-radius:4px;overflow:hidden;
  background-image:radial-gradient(ellipse at 50% 20%,rgba(79,154,142,.22),transparent 65%),
                   radial-gradient(ellipse at 50% 120%,rgba(192,80,63,.22),transparent 70%);
  box-shadow:0 8px 18px rgba(0,0,0,.45);position:relative;transition:transform .18s ease;
}
.horror.boss{width:clamp(220px,60vw,300px);border-color:var(--blood)}
.horror .h-top{display:flex;justify-content:space-between;align-items:center;padding:7px 9px 0}
.vida{font-family:var(--label);font-size:17px;min-width:32px;height:32px;display:grid;place-items:center;background:#3a1712;color:#f6cfc6;border:1px solid var(--blood);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);font-variant-numeric:tabular-nums}
.vida.down{background:#1d3b36;border-color:var(--copper);color:#d8f1ea}
.clock{display:flex;gap:3px;align-items:center}
.tick{width:10px;height:10px;border-radius:50%;border:1px solid var(--sodium)}
.tick.on{background:var(--sodium)}
.clock.now .tick.on{background:var(--blood);border-color:var(--blood)}
.horror .h-name{font-family:var(--display);font-size:24px;line-height:1;padding:6px 9px 0;color:#e6efe9}
.horror .art{display:grid;place-items:center;color:#c4ece0;margin:6px 9px 4px;height:86px;border-radius:3px;
  background:radial-gradient(ellipse at 50% 62%,rgba(127,195,180,.3),transparent 70%),linear-gradient(180deg,#0a1214,#1a2a2a);box-shadow:inset 0 0 0 1px rgba(127,195,180,.22)}
.horror .art svg{width:66px;height:66px;filter:drop-shadow(0 0 5px rgba(127,195,180,.5))}
.horror.boss .art{height:116px;color:#f4cbc0;background:radial-gradient(ellipse at 50% 58%,rgba(192,80,63,.42),transparent 70%),linear-gradient(180deg,#0a1214,#2a1512)}
.horror.boss .art svg{width:96px;height:96px;filter:drop-shadow(0 0 6px rgba(192,80,63,.6))}
.horror .h-txt{font-size:13px;line-height:1.3;padding:0 9px 6px;display:grid;gap:3px;flex:1}
.horror .h-txt b{font-family:var(--label);font-weight:500;color:#f0b9ad}
.horror .h-txt i{color:#9fd3c6;font-style:normal}
.horror .acts{padding:0 8px 9px;display:grid;gap:5px}
.horror .btn{width:100%;font-size:13px;padding:6px;background:#1d2b2d;border-color:#3d6461}
.horror .btn.primary{background:#6b2a22;border-color:var(--blood)}
.wound{height:8px;background:#2a1a17;border:1px solid #5c2c26;margin:0 9px 6px;border-radius:4px;overflow:hidden}
.wound span{display:block;height:100%;background:var(--blood)}
.horror.targetable{box-shadow:0 0 0 2px var(--sodium),0 8px 18px rgba(0,0,0,.45)}

.market-wrap{display:grid;gap:10px}
.piles{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}

/* ---------- lateral ---------- */
.side{display:grid;gap:12px;min-width:0}
.panel{border:1px solid var(--rim);border-radius:3px;padding:12px 14px;background:rgba(21,28,37,.78);display:grid;gap:8px;min-width:0}
.panel h3{font-family:var(--label);font-size:16px;color:var(--paper)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
.kv span:last-child{font-family:var(--label);font-variant-numeric:tabular-nums}
.deck-list{display:grid;gap:2px;font-size:14px;max-height:220px;overflow-y:auto}
.deck-list div{display:flex;justify-content:space-between;gap:8px;border-left:3px solid var(--tc);padding-left:6px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:3px;max-height:320px;overflow-y:auto;font-size:13.5px}
.log li{padding:2px 0;border-bottom:1px solid rgba(44,56,72,.6)}
.log li.turn{font-family:var(--label);color:var(--sodium);border-bottom:none;padding-top:6px}
.log li.bad{color:#eaa79c}
.log li.good{color:#a9dacd}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}

.overlay{position:fixed;inset:0;background:rgba(6,9,12,.84);display:grid;place-items:center;z-index:20;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.end{width:min(520px,100%);max-height:100%;overflow-y:auto;background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:24px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.end.lost{background:#101a1c;color:#d3e0dc;border:1px solid var(--blood)}
.end h2{font-family:var(--display);font-size:46px;line-height:1}
.end .verdict{font-style:italic;font-size:18px}
.end table{width:100%;border-collapse:collapse;font-size:15px}
.end td{padding:4px 0;border-bottom:1px dashed rgba(31,35,40,.22)}
.end td:last-child{text-align:right;font-family:var(--label);font-variant-numeric:tabular-nums}
.end tr.total td{border-bottom:none;font-size:19px;padding-top:8px}
.end .btn{justify-self:start}

/* ---------- ampliación: jefes e investigadores ---------- */
.opt .num-badge{font-family:var(--label);font-size:12px;color:var(--sodium)}
.opt .pw{font-size:13px;color:#9fd3c6;font-style:italic}
.invs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.inv-chip{display:grid;gap:4px;padding:8px 12px;border:1px solid var(--rim);border-radius:2px;background:var(--slate);min-width:0;flex:1 1 200px}
.inv-chip.on{border-color:var(--sodium);background:#221d14;box-shadow:inset 0 0 0 1px var(--sodium)}
.inv-chip b{font-family:var(--label);font-weight:500;font-size:15px;color:var(--paper)}
.inv-chip small{font-size:12.5px;color:var(--muted)}
.meter{display:flex;gap:3px;align-items:center}
.meter i{width:14px;height:6px;border:1px solid var(--copper);display:block}
.meter i.on{background:var(--copper)}
.meter.full i{background:var(--sodium);border-color:var(--sodium)}
.nemesis{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 18px;padding:10px 12px;border:1px solid #5c2c26;border-radius:2px;background:rgba(58,23,18,.28)}
@media (max-width:640px){.nemesis{grid-template-columns:minmax(0,1fr)}}
.nemesis h3{font-family:var(--display);font-size:26px;line-height:1;color:#f0c4b9}
.nemesis p{font-size:14px}
.nemesis .lbl{font-family:var(--label);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.nemesis .aug b{font-family:var(--label);font-weight:500;color:var(--sodium)}
.power{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 10px;border:1px dashed #3d6461;border-radius:2px}
.power .pw-txt{font-size:14px;color:#cfe6df;flex:1 1 220px;min-width:0}
.power .pw-txt b{font-family:var(--label);font-weight:500;color:#9fd3c6}

/* ---------- ambiente: el puerto de noche (luna, faro, niebla, olas y lo que sube con la Perdición) ---------- */
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.sky>*{position:absolute}
.moon{top:7vh;right:9vw;width:clamp(70px,14vw,150px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 30% 70%,rgba(120,100,60,.35) 0 9%,transparent 10%),radial-gradient(circle at 64% 38%,rgba(120,100,60,.3) 0 7%,transparent 8%),radial-gradient(circle at 55% 72%,rgba(120,100,60,.25) 0 5%,transparent 6%),
             radial-gradient(circle at 38% 36%,#fff8e6,#e9d9b0 45%,#b9a57a 78%,#8a7754);
  box-shadow:0 0 60px 18px rgba(233,217,176,.16),0 0 200px 70px rgba(224,166,74,.09);animation:moon 9s ease-in-out infinite alternate}
.moon::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 60% 60%,#d0402c,#4a0e08);mix-blend-mode:multiply;opacity:calc((var(--doom,0) - .25) * 1.2);transition:opacity 1.5s}
@media (max-width:640px){.moon{top:26vh;width:64px;opacity:.75}}
@keyframes moon{to{transform:translateY(10px);box-shadow:0 0 80px 26px rgba(233,217,176,.22),0 0 240px 90px rgba(224,166,74,.12)}}
.glint{right:calc(9vw + clamp(20px,4vw,50px));bottom:0;width:clamp(30px,6vw,60px);height:24vh;
  background:repeating-linear-gradient(180deg,rgba(255,236,190,.22) 0 3px,transparent 3px 11px);
  -webkit-mask:linear-gradient(0deg,#000,transparent);mask:linear-gradient(0deg,#000,transparent);animation:glint 2.2s steps(4) infinite;opacity:.7}
@keyframes glint{50%{transform:scaleX(1.5);opacity:.35}}
.beam{left:-6vw;top:30vh;width:130vw;height:46vh;transform-origin:0 50%;
  background:linear-gradient(90deg,rgba(255,236,190,.20),rgba(255,236,190,.05) 45%,transparent 75%);
  clip-path:polygon(0 47%,100% 0,100% 100%,0 53%);animation:beam 14s ease-in-out infinite}
@keyframes beam{0%,100%{transform:rotate(-16deg);opacity:.15}50%{transform:rotate(12deg);opacity:.85}}
.lighthouse{left:1.5vw;top:calc(30vh - 6px);width:10px;height:14px;border-radius:50%;background:#ffe9b8;box-shadow:0 0 18px 8px rgba(255,220,150,.5);animation:blink 14s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
.fog{left:0;width:200%;height:42vh;
  background:radial-gradient(ellipse 14% 38% at 8% 50%,rgba(175,195,195,.13),transparent 70%),radial-gradient(ellipse 20% 30% at 30% 62%,rgba(175,195,195,.10),transparent 70%),
             radial-gradient(ellipse 14% 38% at 58% 50%,rgba(175,195,195,.13),transparent 70%),radial-gradient(ellipse 20% 30% at 80% 62%,rgba(175,195,195,.10),transparent 70%);
  animation:fog 80s linear infinite}
.fog.f1{top:4vh}

  reliquia:{n:'Reliquia de Valusia',t:'objeto',c:6,k:1,vp:1,x:'+2 Saber. +2 Voluntad.',play:()=>{sab(2);vol(2);return '+2 Saber, +2 Voluntad';}}
};

const HORRORS = {

  migo:{n:'Mi-Go',tier:2,k:1,v:5,r:3,tr:3,s:'+1 Perdición y una Pesadilla.',
    hit:(h,p)=>{perd(1);gainNightmare(p,'discard');return '+1 Perdición, +1 Pesadilla';},l:'+2 Saber.',loot:()=>sab(2)},
  color:{n:'El Color del Espacio',tier:2,k:1,v:5,r:2,tr:3,s:'Una Pesadilla encima del mazo de un investigador.',

  shoggoth:{n:'Shoggoth',tier:2,k:1,v:7,r:2,tr:4,s:'−3 Cordura.',hit:()=>{cord(-3);return '−3 Cordura';},l:'−1 Perdición.',loot:()=>perd(-1)},
  polipo:{n:'Pólipo Volante',tier:2,k:1,v:6,r:2,tr:4,s:'+2 Perdición.',hit:()=>{perd(2);return '+2 Perdición';},l:'−2 Perdición.',loot:()=>perd(-2)},
  faraon:{n:'El Faraón Negro',tier:2,k:1,v:8,r:3,tr:5,s:'+1 Perdición y dos Pesadillas.',
    hit:(h,p)=>{perd(1);gainNightmare(p,'discard');gainNightmare(p,'discard');return '+1 Perdición, +2 Pesadillas';},l:'−2 Perdición. +2 Cordura.',loot:()=>{perd(-2);cord(2);}}
};

// ---------- jefes ----------
const BOSSES = {
  durmiente:{n:'El Durmiente',r:'Sueña bajo el arrecife desde antes de que existieran los hombres.',v:20,ritmo:2,
    pre:'Cada Augurio añade además +1 Perdición.',
    s:'−3 Cordura, +1 Perdición y una Pesadilla.',
    hit:(h,p)=>{cord(-3);perd(1);gainNightmare(p,'discard');return '−3 Cordura, +1 Perdición, +1 Pesadilla';},
    onAug:()=>{perd(1);return '+1 Perdición';},
    aug:['fiebre','crecida','cantico','visiones','cansancio','llamada']},
  madre:{n:'Madre Hidra',r:'Reina de los Profundos, vieja como la propia marea.',v:24,ritmo:2,
    pre:'Los Profundos tienen +1 de Vida.',
    s:'−2 Cordura y un Profundo sube al Muelle.',
    hit:()=>{cord(-2);spawn('profundo');return '−2 Cordura, sube un Profundo';},
    aug:['engendros','canto','crecida','sangre','llamada','cantico']},
  mensajero:{n:'El Mensajero sin Rostro',r:'Camina entre los hombres con mil caras y ninguna.',v:24,ritmo:2,
    pre:'Las cartas que cuestan 4 o más Saber cuestan 1 más.',
    s:'−2 Cordura y devora la carta más cara de un descarte.',
    hit:(h,p)=>{cord(-2);const c=[...p.discard].sort((a,b)=>C(b.id).c-C(a.id).c)[0];if(!c)return '−2 Cordura';p.discard.splice(p.discard.indexOf(c),1);G.exiled.push(c);return `−2 Cordura, devora ${C(c.id).n}`;},
    aug:['engano','mascaras','susurro','llamada','cantico','fiebre']}
};
const everyone = f => G.invs.forEach(f);
const AUG = {
  fiebre:{n:'Sueños febriles',x:'−2 Cordura.',run:()=>{cord(-2);return '−2 Cordura';}},
  crecida:{n:'La marea crece',x:'Sube un Horror más al Muelle.',run:()=>{rise(false);return 'sube un Horror más';}},
  cantico:{n:'Cántico submarino',x:'Los relojes de todos los Horrores avanzan 1.',run:()=>{tickAll();return 'los relojes avanzan';}},
  visiones:{n:"Visiones de R'lyeh",x:'Cada investigador recibe una Pesadilla en su descarte.',run:()=>{everyone(p=>gainNightmare(p,'discard'));return 'una Pesadilla para cada investigador';}},
  cansancio:{n:'Ola de cansancio',x:'Cada investigador descarta una carta al azar de su mano.',
    run:()=>{everyone(p=>{if(p.hand.length){const i=Math.floor(Math.random()*p.hand.length);p.discard.push(...p.hand.splice(i,1));}});return 'cada investigador pierde una carta de la mano';}},
  llamada:{n:'Llamada del abismo',x:'+1 Perdición.',run:()=>{perd(1);return '+1 Perdición';}},
  engendros:{n:'Engendros',x:'Suben dos Profundos al Muelle.',run:()=>{spawn('profundo');spawn('profundo');return 'suben dos Profundos';}},
  canto:{n:'Canto de la Madre',x:'−1 Cordura por cada Profundo en el Muelle.',
    run:()=>{const n=G.muelle.filter(h=>h.id==='profundo').length;cord(-n);return n?`−${n} Cordura`:'ningún Profundo responde';}},
  sangre:{n:'Sangre mezclada',x:'Cada investigador recibe una Pesadilla en su descarte.',run:()=>{everyone(p=>gainNightmare(p,'discard'));return 'una Pesadilla para cada investigador';}},
  engano:{n:'Engaño',x:'Exilia las dos cartas más caras de la Biblioteca.',
    run:()=>{const gone=[];for(let k=0;k<2;k++){let bi=-1;G.market.forEach((c,i)=>{if(c&&(bi<0||C(c.id).c>C(G.market[bi].id).c))bi=i;});if(bi<0)break;gone.push(C(G.market[bi].id).n);G.exiled.push(G.market[bi]);G.market[bi]=G.mdeck.length?G.mdeck.pop():null;}return gone.length?`desaparecen ${gone.join(' y ')}`:'la Biblioteca está vacía';}},
  mascaras:{n:'Mil máscaras',x:'El Horror más débil del Muelle se transforma en uno más fuerte.',
    run:()=>{const hs=G.muelle.filter(h=>!H(h.id).boss);if(!hs.length)return 'no hay nadie a quien transformar';const w=hs.sort((a,b)=>H(a.id).v-H(b.id).v)[0];const opts=Object.keys(HORRORS).filter(id=>HORRORS[id].tier===2);const nid=opts[Math.floor(Math.random()*opts.length)];const old=H(w.id).n;w.id=nid;w.cd=rOf(nid);return `${old} se convierte en ${H(nid).n}`;}},
  susurro:{n:'Susurro',x:'Cada investigador pone una Pesadilla encima de su mazo.',run:()=>{everyone(p=>gainNightmare(p,'deck'));return 'una Pesadilla encima de cada mazo';}}
};

let G = null;
const UI = {diff:'vigilante', boss:'azar', invs:['rourke'], confirmQuit:false};
const C = id => CARDS[id];
const BOSS = () => BOSSES[G.boss];
const H = id => id==='boss' ? {...BOSS(),boss:true,r:BOSS().ritmo,tr:0,l:'Victoria.'} : HORRORS[id];
const P = () => G.invs[G.cur];
const shuffle = a => {for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pickRand = a => a[Math.floor(Math.random()*a.length)];

function log(m,cls=''){G.log.unshift({m,cls});if(G.log.length>120)G.log.length=120;}
function sab(n){G.saber=Math.max(0,G.saber+n);}
function vol(n){G.vol=Math.max(0,G.vol+n);}
function cord(n){G.cordura=Math.max(0,Math.min(G.maxCord,G.cordura+n));}
function perd(n){G.perd=Math.max(0,Math.min(MAXP,G.perd+n));}
function T(t){return G.typed[t]||0;}
function mk(id){return {uid:++G.seq,id};}
function gainNightmare(p,where){const c=mk('pesadilla');if(where==='deck')p.deck.push(c);else p.discard.push(c);}
function askExile(n){if(P().hand.length)G.pending={kind:'exile',n};}
function draw(n,p=P()){
  for(let i=0;i<n;i++){
    if(!p.deck.length){
      if(!p.discard.length)return;
      p.deck=shuffle(p.discard);p.discard=[];
    }
    p.hand.push(p.deck.pop());
  }
}
function vidaOf(h){
  const d=H(h.id);if(d.boss)return G.bossV;
  const extra=G.boss==='madre'&&h.id==='profundo'?1:0;
  return Math.max(1,d.v+extra+G.vidaMod);
}
function costOf(c){const d=C(c.id);return d.c+(G.boss==='mensajero'&&d.c>=4?1:0);}
function dockCap(){return 4+G.invs.length;}
// con varios investigadores, los relojes son un turno más largos
function rOf(id){return H(id).r+(G.invs.length>1?1:0);}
const pname = p => G.invs.length>1?` a ${INVS[p.key].n}`:'';

// ---------- partida ----------
function newGame(diff, bossKey, invKeys){
  const df=DIFF[diff];
  const boss=bossKey==='azar'?pickRand(Object.keys(BOSSES)):bossKey;
  const n=invKeys.length;
  G={seq:0,diff,boss,round:1,cur:0,saber:0,vol:0,
     maxCord:df.cord+2*(n-1),cordura:df.cord+2*(n-1),perd:df.perd,
     bossV:Math.round((BOSSES[boss].v+df.bossMod)*(1+0.6*(n-1))),
     invs:[],exiled:[],market:[],mdeck:[],marea:[],muelle:[],trofeos:[],
     augDeck:[],lastAug:null,typed:{},vidaMod:0,pending:null,log:[],phase:'play',result:null};
  for(const key of invKeys){
    const p={key,deck:[],hand:[],played:[],discard:[],res:0};
    const ids=[...Array(6).fill('nota'),...Array(4).fill('valor')];
    const sw=INVS[key].swap;ids[ids.indexOf(sw[0])]=sw[1];
    p.deck=shuffle(ids.map(mk));
    G.invs.push(p);
  }
  for(const [id,d] of Object.entries(CARDS)){if(d.k)for(let i=0;i<d.k;i++)G.mdeck.push(mk(id));}
  shuffle(G.mdeck);
  for(let i=0;i<5;i++)G.market.push(G.mdeck.pop());
  // la Marea: el jefe al fondo, luego los horrores fuertes y encima los débiles
  const size=11+8*n,n1=Math.ceil(size*0.55);
  const pool=t=>{const a=[];for(const [id,d] of Object.entries(HORRORS))if(d.tier===t)for(let i=0;i<d.k;i++)a.push(id);return a;};
  const sample=(t,cnt)=>{const out=[];let bag=[];while(out.length<cnt){if(!bag.length)bag=shuffle(pool(t));out.push(bag.pop());}return out;};
  const mkH=id=>({uid:++G.seq,id,cd:0,dmg:0});
  G.marea=[mkH('boss'),...sample(2,size-n1).map(mkH),...sample(1,n1).map(mkH)];
  G.augDeck=shuffle([...BOSSES[boss].aug]);
  UI.confirmQuit=false;
  log(`Llegáis a Innsmouth al anochecer. Os acecha ${BOSSES[boss].n}. Dificultad: ${df.n}.`);
  for(const p of G.invs)draw(HAND,p);
  log(`Ronda 1 · turno de ${INVS[P().key].n}`,'turn');
}
function spawn(id){
  if(G.muelle.length>=dockCap()){perd(2);log(`No cabe nadie más en el Muelle: ${H(id).n} se pierde en las calles. +2 Perdición`,'bad');return;}
  G.muelle.push({uid:++G.seq,id,cd:rOf(id),dmg:0});
  log(`${H(id).n} sube al Muelle.`,'bad');
}
function rise(allowBoss=true){
  if(!G.marea.length)return;
  const top=G.marea[G.marea.length-1];const d=H(top.id);
  if(d.boss&&!allowBoss)return;
  G.marea.pop();
  if(G.muelle.length>=dockCap()&&!d.boss){perd(2);log(`El Muelle está lleno: ${d.n} se pierde en las calles. +2 Perdición`,'bad');return;}
  top.cd=rOf(top.id);G.muelle.push(top);
  log(d.boss?`La marea se retira y ${d.n} emerge de las aguas.`:`${d.n} sube al Muelle.`,'bad');
}
function strike(h){
  const d=H(h.id);const p=pickRand(G.invs);
  log(`${d.n} ataca${pname(p)}: ${d.hit(h,p)}`,'bad');
  h.cd=rOf(h.id);check();
}
function tickAll(){
  for(const h of [...G.muelle]){if(G.phase==='over')return;h.cd--;if(h.cd<=0)strike(h);}
}
function augur(){
  if(!G.augDeck.length)G.augDeck=shuffle([...BOSS().aug]);
  const id=G.augDeck.pop();G.lastAug=id;
  log(`Augurio · ${AUG[id].n}: ${AUG[id].run()}`,'bad');
  if(BOSS().onAug)log(`${BOSS().n}: ${BOSS().onAug()}`,'bad');
  check();
}
function check(){
  if(!G||G.phase==='over')return;
  if(G.cordura<=0)lose('locura');
  else if(G.perd>=MAXP)lose('despertar');
}
function playable(c){
  const d=C(c.id);
  if(!d.play||G.phase!=='play'||G.pending)return false;
  if(d.can&&!d.can())return false;
  return true;
}
function playCard(uid){
  const p=P();const i=p.hand.findIndex(c=>c.uid===uid);if(i<0)return;
  const c=p.hand[i];if(!playable(c))return;
  p.hand.splice(i,1);
  const d=C(c.id);
  const r=d.play(c);
  G.typed[d.t]=(G.typed[d.t]||0)+1;
  if(d.once)G.exiled.push(c);else p.played.push(c);
  log(`${d.n}${r?': '+r:''}${d.once?' (exiliada)':''}`);
  check();
}
const AUTO_SKIP=['cultes','medico','destierro','sello','elixir','dinamita','polvo'];
function playAll(){
  let guard=0;
  while(guard++<60&&G.phase==='play'&&!G.pending){
    const c=P().hand.find(x=>playable(x)&&!C(x.id).cc&&!AUTO_SKIP.includes(x.id));
    if(!c)break;
    playCard(c.uid);
  }
}
function exile(uid){
  if(!G.pending||G.pending.kind!=='exile')return;
  const p=P();const i=p.hand.findIndex(c=>c.uid===uid);if(i<0)return;
  const [c]=p.hand.splice(i,1);G.exiled.push(c);
  log(`Exilias ${C(c.id).n} de tu mazo`,'good');
  G.pending.n--;
  if(G.pending.n<=0||!p.hand.length)G.pending=null;
}
function skipPending(){G.pending=null;}
function targetHorror(uid){
  if(!G.pending||G.pending.kind!=='target')return;
  const i=G.muelle.findIndex(h=>h.uid===uid);if(i<0)return;
  const h=G.muelle[i];if(H(h.id).boss)return;
  G.muelle.splice(i,1);
  const b=G.marea.findIndex(x=>H(x.id).boss);
  G.marea.splice(b<0?0:b+1,0,h);
  G.pending=null;
  log(`${H(h.id).n} vuelve a la Marea`,'good');
}
function canKill(h){return G.pending&&G.pending.kind==='kill'&&!H(h.id).boss&&vidaOf(h)<=6;}
function killHorror(uid){
  const h=G.muelle.find(x=>x.uid===uid);if(!h||!canKill(h))return;
  G.pending=null;defeat(h,false);
}
function canBuy(c){return G.phase==='play'&&!G.pending&&G.saber>=costOf(c);}
function buy(uid){
  const i=G.market.findIndex(c=>c&&c.uid===uid);if(i<0)return;
  const c=G.market[i];if(!canBuy(c))return;
  sab(-costOf(c));P().discard.push(c);
  G.market[i]=G.mdeck.length?G.mdeck.pop():null;
  log(`Compras ${C(c.id).n} (${costOf(c)} Saber)`,'good');
}
function takeFree(uid){
  if(!G.pending||G.pending.kind!=='free')return;
  const i=G.market.findIndex(c=>c&&c.uid===uid);if(i<0)return;
  const c=G.market[i];P().discard.push(c);
  G.market[i]=G.mdeck.length?G.mdeck.pop():null;
  G.pending=null;
  log(`Consigues gratis ${C(c.id).n}`,'good');
}
function buyPile(id){
  const c=mk(id);if(!canBuy(c)){G.seq--;return;}
  sab(-costOf(c));P().discard.push(c);
  log(`Compras ${C(id).n} (${costOf(c)} Saber)`,'good');
}
function canRenew(){return G.phase==='play'&&!G.pending&&G.saber>=2&&G.mdeck.length>0;}
function renew(){
  if(!canRenew())return;
  sab(-2);
  const old=G.market.filter(Boolean);
  G.market=[];
  for(let i=0;i<5;i++)G.market.push(G.mdeck.length?G.mdeck.pop():null);
  G.mdeck.unshift(...shuffle(old));
  log('Renuevas la Biblioteca (2 Saber)');
}
function gainRes(n){const p=P();p.res=Math.min(INVS[p.key].need,p.res+n);}
function canPower(){
  const p=P(),inv=INVS[p.key];
  return G.phase==='play'&&!G.pending&&p.res>=inv.need&&(!inv.can||inv.can());
}
function usePower(){
  if(!canPower())return;
  const p=P(),inv=INVS[p.key];
  p.res=0;
  const r=inv.power();
  log(`${inv.n} usa ${inv.pn}${r?': '+r:''}`,'good');
  check();
}
function defeat(h,res){
  const d=H(h.id);
  G.muelle.splice(G.muelle.indexOf(h),1);G.trofeos.push(h);
  d.loot();
  if(res)gainRes(1);
  log(`Derrotas a ${d.n} (+${d.tr} PV). Botín: ${d.l}`,'good');
  check();
}
function canAttack(h){return G.phase==='play'&&!G.pending&&!H(h.id).boss&&G.vol>=vidaOf(h);}
function attack(uid){
  const h=G.muelle.find(x=>x.uid===uid);if(!h||!canAttack(h))return;
  vol(-vidaOf(h));defeat(h,true);
}
function canWound(h){return G.phase==='play'&&!G.pending&&H(h.id).boss&&G.vol>0;}
function wound(uid){
  const h=G.muelle.find(x=>x.uid===uid);if(!h||!canWound(h))return;
  const n=G.vol;G.vol=0;h.dmg+=n;
  if(n>=4)gainRes(1);
  log(`Hieres a ${BOSS().n}: ${n} de daño (${Math.min(h.dmg,G.bossV)}/${G.bossV})`,'good');
  if(h.dmg>=G.bossV)win();
}
function endTurn(){
  if(G.phase!=='play'||G.pending)return;
  const p=P();
  p.discard.push(...p.hand,...p.played);p.hand=[];p.played=[];
  G.saber=0;G.vol=0;G.vidaMod=0;G.typed={};
  draw(HAND,p);
  // al final de cada turno: los horrores avanzan y sube la marea
  tickAll();if(G.phase==='over')return;
  if(G.round>=2)rise();
  check();if(G.phase==='over')return;
  if(G.cur<G.invs.length-1){G.cur++;log(`Turno de ${INVS[P().key].n}`,'turn');return;}
  // fin de ronda: quizá llega un augurio
  if(G.round%AUG_EVERY===0){augur();if(G.phase==='over')return;}
  G.round++;G.cur=0;
  log(`Ronda ${G.round} · turno de ${INVS[P().key].n}`,'turn');
}
function scoreRows(){
  const rows=[];
  rows.push([`${BOSS().n} derrotado`,10]);
  rows.push([`Trofeos (${G.trofeos.length} Horrores derrotados)`,G.trofeos.reduce((s,h)=>s+H(h.id).tr,0)]);
  const all=G.invs.flatMap(p=>[...p.deck,...p.hand,...p.played,...p.discard]);
  const vp=all.reduce((s,c)=>s+Math.max(0,C(c.id).vp||0),0);if(vp)rows.push(['Cartas valiosas de vuestros mazos',vp]);
  const pes=all.filter(c=>c.id==='pesadilla').length;if(pes)rows.push([`Pesadillas en vuestros mazos (${pes})`,-pes]);
  rows.push(['Cordura restante',G.cordura]);
  const left=G.muelle.filter(h=>!H(h.id).boss);
  if(left.length)rows.push([`Horrores que siguen en el Muelle (${left.length})`,-left.reduce((s,h)=>s+H(h.id).tr,0)]);
  return rows;
}
function win(){
  G.phase='over';
  const rows=scoreRows();const total=rows.reduce((s,r)=>s+r[1],0);
  G.result={win:true,rows,total};
  log(`${BOSS().n} se hunde de nuevo bajo las olas. ${total} PV.`,'turn');
}
function lose(reason){
  G.phase='over';G.result={win:false,reason};
  log(reason==='locura'?'La Cordura llega a 0.':'La Perdición llega a 10.','bad');
}
function rank(t){
  if(t<30)return 'Innsmouth sigue en pie, aunque nadie en Arkham cree una palabra de lo que contáis.';
  if(t<40)return 'Los pescadores vuelven a salir al mar. Vosotros no volvéis a acercaros al agua.';
  if(t<50)return 'Vuestro informe llega a la Universidad de Miskatonic y alguien decide quemarlo.';
  return 'La marea vuelve a dormir. Pasarán siglos antes de que vuelva a soñar con vosotros.';
}

// ---------- dibujo ----------
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function sigil(id, horror){
  let h=hash(id)||7;
  const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296;};
  const k=3+Math.floor(rnd()*5),rot=rnd()*Math.PI*2;
  let o=`<svg viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">`;
  if(horror){
    for(let i=0;i<k+2;i++){
      const a=rot+i*2*Math.PI/(k+2),bend=(rnd()-.5)*1.6;
      const x2=32+28*Math.cos(a),y2=32+28*Math.sin(a);
      const qx=32+18*Math.cos(a+bend),qy=32+18*Math.sin(a+bend);
      o+=`<path d="M32 32Q${qx.toFixed(1)} ${qy.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}" opacity=".8"/>`;
    }
    o+=`<ellipse cx="32" cy="32" rx="12" ry="7" fill="#101a1c"/><circle cx="32" cy="32" r="3.5" fill="currentColor"/>`;
  } else {
    o+=`<circle cx="32" cy="32" r="26" opacity=".5"/>`;
    for(let i=0;i<k;i++){
      const a=rot+i*2*Math.PI/k,r1=8+rnd()*6;
      const x1=32+r1*Math.cos(a),y1=32+r1*Math.sin(a),x2=32+24*Math.cos(a),y2=32+24*Math.sin(a);
      o+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
      o+=`<circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="2" fill="currentColor" stroke="none"/>`;
    }
    o+=`<circle cx="32" cy="32" r="${(5+rnd()*4).toFixed(1)}"/>`;
  }
  return o+'</svg>';
}

function art(id, horror){
  const body=ICONS[id];
  if(!body)return sigil(id,horror);
  return `<svg viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
}

const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

function cardHTML(c, zone){
  const d=C(c.id);
  const vp=d.vp?`<span class="vp">${d.vp>0?'+':''}${d.vp} PV</span>`:'<span class="vp"></span>';
  let acts='',cls='';
  const pk=G.pending&&G.pending.kind;
  if(zone==='hand'){
    if(pk==='exile')acts=`<button class="btn primary" data-a="exile" data-u="${c.uid}">Exiliar</button>`;
    else if(d.play)acts=`<button class="btn primary" data-a="play" data-u="${c.uid}" ${playable(c)?'':'disabled'}>Jugar</button>`;
  } else if(zone==='market'){
    acts=pk==='free'?`<button class="btn primary" data-a="free" data-u="${c.uid}">Conseguir gratis</button>`
                    :`<button class="btn primary" data-a="buy" data-u="${c.uid}" ${canBuy(c)?'':'disabled'}>Comprar</button>`;
  } else if(zone==='pile'){
    acts=`<button class="btn primary" data-a="pile" data-u="${c.id}" ${canBuy(c)?'':'disabled'}>Comprar · siempre disponible</button>`;
  }
  if(c.id==='pesadilla')cls=' pesadilla';
  const cost=zone==='market'||zone==='pile'?`<span class="cost" title="Coste en Saber">${costOf(c)}</span>`:'<span></span>';
  return `<article class="card${cls}"${c.uid?` data-k="c${c.uid}"`:''} style="--tc:var(--t-${d.t});--hx:${20+hash(c.id)%60}%;--off:-${c.uid%9*.6}s">
    <div class="head"><span class="kind">${TYPES[d.t]}</span><h3 class="name">${esc(d.n)}</h3></div>
    <div class="art">${art(c.id,false)}</div>
    <p class="txt">${d.x}</p>
    <div class="foot">${cost}${vp}</div>
    ${acts?`<div class="acts">${acts}</div>`:''}
  </article>`;
}
function horrorHTML(h){
  const d=H(h.id);
  const v=vidaOf(h);
  const ticks=Array.from({length:rOf(h.id)},(_,i)=>`<span class="tick${i<h.cd?' on':''}"></span>`).join('');
  const pk=G.pending&&G.pending.kind;
  let acts='',tgt=false;
  if(pk==='target'){
    if(!d.boss){acts=`<button class="btn primary" data-a="target" data-u="${h.uid}">Devolver a la Marea</button>`;tgt=true;}
  } else if(pk==='kill'){
    if(canKill(h)){acts=`<button class="btn primary" data-a="kill" data-u="${h.uid}">Arponear</button>`;tgt=true;}
  } else if(d.boss){
    acts=`<button class="btn primary" data-a="wound" data-u="${h.uid}" ${canWound(h)?'':'disabled'}>Herir con ${G.vol} de Voluntad</button>`;
  } else {
    acts=`<button class="btn primary" data-a="attack" data-u="${h.uid}" ${canAttack(h)?'':'disabled'}>Derrotar · ${v} Voluntad</button>`;
  }
  const base=d.v+(G.boss==='madre'&&h.id==='profundo'?1:0);
  return `<article class="horror${d.boss?' boss':''}${tgt?' targetable':''}${h.cd===1&&!pk?' warn':''}" data-k="h${h.uid}" style="--off:-${h.uid%7*.7}s">
    <div class="h-top"><span class="vida${!d.boss&&v<base?' down':''}" title="Vida">${d.boss?G.bossV-h.dmg:v}</span>
      <span class="clock${h.cd===1?' now':''}" title="Turnos hasta su ataque">${ticks}</span></div>
    <h3 class="h-name">${esc(d.n)}</h3>
    <div class="art">${art(d.boss?G.boss:h.id,true)}</div>
    ${d.boss?`<div class="wound" title="Heridas"><span style="width:${Math.min(100,100*h.dmg/G.bossV)}%"></span></div>`:''}
    <div class="h-txt">
      <span><b>Ataca ${h.cd===1?'al final de este turno':`en ${h.cd} turnos`}:</b> ${esc(d.s)}</span>
      ${d.boss?'<i>Las heridas se acumulan entre turnos.</i>':`<i>Botín: ${esc(d.l)} Trofeo ${d.tr} PV.</i>`}
    </div>
    ${acts?`<div class="acts">${acts}</div>`:''}
  </article>`;
}

function rulesHTML(){
  return `<details class="rules">
  <summary>Cómo se juega</summary>
  <div class="rules-body">
    <p>Elegís de 1 a 3 investigadores. Cada uno tiene su propio mazo de 10 cartas (Notas para Saber, Valor para Voluntad y una carta propia) y juega su turno por orden. El Saber y la Voluntad no se guardan entre turnos. La Cordura y la Perdición son del grupo.</p>
    <h3>El turno de un investigador</h3>
    <ul>
      <li><b>Juega</b> las cartas de su mano. Algunas cuestan Cordura y otras permiten exiliar cartas débiles del mazo.</li>
      <li><b>Compra</b> en la Biblioteca. Las cartas compradas van a su descarte. La Biblioteca se renueva por 2 Saber.</li>
      <li><b>Derrota</b> a un Horror gastando Voluntad igual a su Vida. Da un botín, un trofeo y 1 punto de Resolución.</li>
      <li><b>Resolución:</b> cuando el medidor se llena, el investigador puede usar su poder una vez y el medidor vuelve a cero. También sube al herir al jefe con 4 o más de Voluntad de golpe.</li>
    </ul>
    <h3>Al final de cada turno</h3>
    <ul>
      <li>Los relojes de los Horrores avanzan. Al llegar a cero atacan a un investigador al azar y el reloj vuelve a empezar. Si jugáis 2 o más investigadores, cada reloj tiene un turno más.</li>
      <li>Desde la ronda 2 sube un Horror nuevo. Si el Muelle está lleno, +2 Perdición.</li>
      <li>Al final de cada 3 rondas (cuando todos han jugado) el jefe revela un <b>Augurio</b>, un efecto propio de cada jefe.</li>
      <li>Cuando se acaba la Marea, emerge el jefe. Sus heridas se acumulan. Si lo derrotáis, ganáis.</li>
    </ul>
    <h3>Derrota</h3>
    <ul><li>Perdéis si la Cordura llega a 0 o la Perdición llega a 10. Las Pesadillas no hacen nada y atascan la mano: exiliadlas cuando podáis.</li></ul>
  </div>
</details>`;
}

      `<button class="opt" data-a="diff" data-u="${id}" aria-pressed="${UI.diff===id}"><b>${o.n}</b><span>${esc(o.x)}</span></button>`).join('')}</div></div>
    <div class="start-row"><button class="btn primary big" data-a="start" ${UI.invs.length?'':'disabled'}>Bajar al Muelle</button></div>
    ${rulesHTML()}

}
function bars(n,max,cls){return `<span class="bar ${cls}">${Array.from({length:max},(_,i)=>`<span class="seg${i<n?' on':''}"></span>`).join('')}<span class="num">${n}/${max}</span></span>`;}
function meter(p){const need=INVS[p.key].need;return `<span class="meter${p.res>=need?' full':''}">${Array.from({length:need},(_,i)=>`<i class="${i<p.res?'on':''}"></i>`).join('')}</span>`;}

function hint(){
  const pk=G.pending&&G.pending.kind;
  if(pk==='exile')return `Elige una carta de tu mano para exiliarla para siempre${G.pending.n>1?` (quedan ${G.pending.n})`:''}, o sáltatelo.`;
  if(pk==='target')return 'Elige un Horror del Muelle para devolverlo a la Marea.';
  if(pk==='free')return 'Elige una carta de la Biblioteca para conseguirla gratis.';
  if(pk==='kill')return 'Elige un Horror de Vida 6 o menos para arponearlo.';
  if(P().hand.some(playable))return 'Juega cartas, compra en la Biblioteca y derrota Horrores. Después, termina el turno.';
  return 'Gasta lo que te quede y termina el turno.';
}
function deckList(p){
  const all=[...p.deck,...p.hand,...p.played,...p.discard];
  const m={};for(const c of all)m[c.id]=(m[c.id]||0)+1;
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([id,n])=>`<div style="--tc:var(--t-${C(id).t})"><span>${esc(C(id).n)}</span><span>${n}</span></div>`).join('');
}

}

function endHTML(){
  const r=G.result;
  const who=G.invs.map(p=>INVS[p.key].n).join(', ');
  if(r.win)return `<div class="overlay"><div class="end" role="dialog" aria-label="Resultado">
    <h2>${esc(BOSS().n)} cae</h2><p class="verdict">${esc(rank(r.total))}</p>
    <table>${r.rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v>0?'+':''}${v}</td></tr>`).join('')}<tr class="total"><td>Total</td><td>${r.total} PV</td></tr></table>
    <p>${esc(who)} · ${DIFF[G.diff].n} · ${G.round} rondas</p>
    <button class="btn primary big" data-a="again">Jugar de nuevo</button></div></div>`;
  const txt=r.reason==='locura'?'Os encuentran al amanecer en el extremo del muelle, mirando el agua y repitiendo un nombre que nadie sabe pronunciar.':`La Perdición llega a 10. Las campanas de la iglesia suenan solas y ${BOSS().n} ya no tiene prisa.`;
  return `<div class="overlay"><div class="end lost" role="dialog" aria-label="Resultado">
    <h2>${r.reason==='locura'?'Locura':'La marea gana'}</h2><p class="verdict">${esc(txt)}</p>
    <p>${esc(who)} aguantaron ${G.round} rondas contra ${esc(BOSS().n)}. Quedaban ${G.marea.length} cartas en la Marea.</p>
    <button class="btn primary big" data-a="again">Intentarlo de nuevo</button></div></div>`;

const HAS_DOM=typeof document!=='undefined';
const KEY='marea-innsmouth-2';
function save(){try{if(G)localStorage.setItem(KEY,JSON.stringify(G));else localStorage.removeItem(KEY);}catch(e){}}
function render(){if(!HAS_DOM)return;document.getElementById('app').innerHTML=G?boardHTML():titleHTML();save();}

// ---------- efectos: se compara la mesa antes y después de cada acción ----------
const FX={snap:null,q:0,reduce:HAS_DOM&&matchMedia('(prefers-reduced-motion: reduce)').matches};
const FX_COL={saber:'#f0b964',vol:'#86c9bc',cordura:'#9fd3c6',perd:'#ff7a66',marea:'#9fd3c6'};
const FX_NAME={saber:'Saber',vol:'Voluntad',cordura:'Cordura',perd:'Perdición',marea:''};
const FX_EXIT={
  slain:{d:950,k:[{transform:'none',opacity:1,filter:'none'},{offset:.2,transform:'scale(1.08) rotate(-2deg)',filter:'brightness(2.2) saturate(0)'},{transform:'scale(.5) translateY(40px) rotate(8deg)',opacity:0,filter:'blur(8px) brightness(.3)'}]},
  sink:{d:850,k:[{transform:'none',opacity:1,filter:'none'},{transform:'translateY(70px) scaleY(.5)',opacity:0,filter:'blur(6px) hue-rotate(60deg)'}]},
  burn:{d:900,k:[{opacity:1,filter:'none',transform:'none'},{offset:.35,filter:'sepia(1) saturate(3) brightness(1.5)',transform:'translateY(-6px)'},{opacity:0,filter:'sepia(1) brightness(.2) blur(4px)',transform:'translateY(-40px) scale(.9) rotate(-3deg)'}]},
  play:{d:650,k:[{opacity:1,transform:'none',filter:'none'},{offset:.4,opacity:1,transform:'translateY(-28px) scale(1.08)',filter:'brightness(1.4)'},{opacity:0,transform:'translateY(-70px) scale(.85)',filter:'brightness(2) blur(3px)'}]},
  fade:{d:400,k:[{opacity:1},{opacity:0}]}
};
function fxLayer(){let l=document.getElementById('fx');if(!l){l=document.createElement('div');l.id='fx';l.setAttribute('aria-hidden','true');document.body.appendChild(l);}return l;}
function fxStats(){return {saber:G.saber,vol:G.vol,cordura:G.cordura,perd:G.perd,marea:G.marea.length};}
function fxBefore(){
  const els={};
  if(G)document.querySelectorAll('#app [data-k]').forEach(el=>{els[el.dataset.k]={el,r:el.getBoundingClientRect()};});
  FX.snap={els,stats:G?fxStats():null,top:G?G.log[0]:null,sx:scrollX,sy:scrollY};
}
function fxAmbient(){
  const r=document.documentElement;
  r.style.setProperty('--clk',`-${(performance.now()/1000).toFixed(2)}s`);
  r.style.setProperty('--doom',G?(G.perd/MAXP).toFixed(2):'.3');
  r.classList.toggle('mad',!!G&&G.phase!=='over'&&G.cordura/G.maxCord<=.3);
}
function fxAfter(){
  const s=FX.snap;FX.snap=null;
  fxAmbient();
  if(!s||!G||FX.reduce)return;
  const now={};document.querySelectorAll('#app [data-k]').forEach(el=>now[el.dataset.k]=el);
  let i=0,fly=0;
  for(const [k,el] of Object.entries(now)){
    const o=s.els[k];
    if(!o){fxEnter(el,Math.min(i++,10));continue;}
    const r=el.getBoundingClientRect();
    const dx=o.r.left+s.sx-(r.left+scrollX),dy=o.r.top+s.sy-(r.top+scrollY);
    if(Math.abs(dx)+Math.abs(dy)>6)el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:500,easing:'cubic-bezier(.2,.8,.2,1)'});
  }
  for(const [k,o] of Object.entries(s.els)){
    if(now[k])continue;
    const ex=fxExit(k);if(ex.fly)ex.delay=Math.min(fly++,6)*60;
    fxGhost(o,ex,s);
  }
  if(!s.stats){fxBanner('Innsmouth',`Os acecha ${BOSS().n}`,'boss',2400);return;}
  const n=fxStats();
  for(const key in n){const d=n[key]-s.stats[key];if(d)fxDelta(key,d);}
  const fresh=[];for(const l of G.log){if(l===s.top)break;fresh.push(l);}
  fxEvents(fresh.reverse());
}
function fxEnter(el,i){
  el.style.setProperty('--i',i);
  const hor=el.classList.contains('horror');
  el.classList.add(hor?'fx-emerge':el.closest('[data-flip]')?'fx-flip':'fx-deal');
  if(hor){const r=el.getBoundingClientRect();setTimeout(()=>fxBurst(r.left+r.width/2,r.bottom-12,'#7fc3b4',16,'up'),i*130+250);}
}
function fxExit(k){
  const uid=+k.slice(1),has=a=>a.some(x=>x&&x.uid===uid);
  if(k[0]==='h'){
    if(has(G.trofeos))return {cls:'slain',burst:'#e0604a'};
    if(has(G.marea))return {cls:'sink',burst:'#7fc3b4'};
    return {cls:'fade'};
  }
  if(has(G.exiled))return {cls:'burn',burst:'#f0a040'};
  if(G.invs.some(p=>has(p.played)))return {cls:'play',burst:'#f0c070'};
  if(G.invs.some(p=>has(p.discard)||has(p.deck)))return {fly:'[data-fly="discard"]'};
  return {cls:'sink'};
}
function fxGhost(o,ex,s){
  const g=o.el,r=o.r,x=r.left+s.sx-scrollX,y=r.top+s.sy-scrollY;
  g.classList.remove('fx-deal','fx-flip','fx-emerge','warn','targetable');
  Object.assign(g.style,{position:'absolute',left:x+'px',top:y+'px',width:r.width+'px',height:r.height+'px',margin:'0',animation:'none'});
  fxLayer().appendChild(g);
  let a;
  if(ex.fly){
    const t=document.querySelector(ex.fly),tr=t?t.getBoundingClientRect():{left:x,top:innerHeight,width:0,height:0};
    const dx=tr.left+tr.width/2-(x+r.width/2),dy=tr.top+tr.height/2-(y+r.height/2);
    a=g.animate([{transform:'none',opacity:1},{offset:.25,transform:'translateY(-14px) scale(1.04)',opacity:1},{transform:`translate(${dx}px,${dy}px) scale(.15) rotate(${dx>0?20:-20}deg)`,opacity:.1}],{duration:700,delay:ex.delay,easing:'cubic-bezier(.45,0,.55,1)',fill:'both'});
  } else {
    const e=FX_EXIT[ex.cls];a=g.animate(e.k,{duration:e.d,easing:'ease-in',fill:'forwards'});
  }
  if(ex.burst)fxBurst(x+r.width/2,y+r.height/2,ex.burst,ex.cls==='slain'?28:16,ex.cls==='burn'||ex.cls==='play'?'up':'out');
  a.onfinish=()=>g.remove();setTimeout(()=>g.remove(),2500);
}
function fxBurst(x,y,color,n,mode){
  const L=fxLayer();
  for(let i=0;i<n;i++){
    const p=document.createElement('span'),sz=3+Math.random()*5,a=Math.random()*Math.PI*2,v=40+Math.random()*100;
    p.className='fx-p';
    Object.assign(p.style,{left:x+'px',top:y+'px',width:sz+'px',height:sz+'px',marginLeft:-sz/2+'px',marginTop:-sz/2+'px',background:color,boxShadow:`0 0 ${sz*2}px ${color}`});
    L.appendChild(p);
    const dx=mode==='up'?(Math.random()-.5)*90:Math.cos(a)*v,dy=mode==='up'?-(50+Math.random()*120):Math.sin(a)*v;
    p.animate([{transform:'none',opacity:1},{transform:`translate(${dx}px,${dy}px) scale(.3)`,opacity:0}],{duration:600+Math.random()*700,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'}).onfinish=()=>p.remove();
  }
}
function fxFloat(el,text,color,delay=0){
  if(!el)return;const r=el.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;
  const t=document.createElement('span');t.className='fx-t';t.textContent=text;t.style.color=color;
  t.style.left=(r.left+r.width/2)+'px';t.style.top=(r.top+r.height/2)+'px';
  fxLayer().appendChild(t);
  t.animate([{transform:'translate(-50%,-50%) scale(.6)',opacity:0},{offset:.15,transform:'translate(-50%,-90%) scale(1.25)',opacity:1},{transform:'translate(-50%,-260%) scale(1)',opacity:0}],{duration:1400,delay,easing:'ease-out',fill:'both'}).onfinish=()=>t.remove();
}
function fxShake(p){
  const k=[0,-1,1,-1,1,-.5,.5,0].map((v,i)=>({transform:`translate(${v*p*3}px,${(i%2?1:-1)*p}px)`}));
  document.querySelectorAll('#app>:not(.overlay)').forEach(el=>el.animate(k,{duration:420,easing:'ease-out'}));
}
function fxFlash(kind){
  const f=document.createElement('div');f.className='fx-flash '+kind;document.body.appendChild(f);
  f.animate([{opacity:0},{opacity:1,offset:.25},{opacity:0}],{duration:kind==='hurt'?650:900,fill:'forwards'}).onfinish=()=>f.remove();
}
function fxBanner(h,p,kind='',dur=1700){
  // si se juega deprisa, los carteles de turno atrasados se descartan
  const t=performance.now(),delay=Math.max(0,FX.q-t);
  if((kind==='turn'&&delay>600)||(kind!=='boss'&&delay>2500))return;
  FX.q=t+delay+dur*.8;
  const b=document.createElement('div');b.className='fx-banner '+kind;
  b.innerHTML=`<h2>${esc(h)}</h2>${p?`<p>${esc(p)}</p>`:''}`;
  document.body.appendChild(b);
  b.animate([{opacity:0,transform:'scale(1.25)',filter:'blur(10px)'},{offset:.18,opacity:1,transform:'scale(1)',filter:'blur(0)'},{offset:.8,opacity:1,transform:'scale(.98)'},{opacity:0,transform:'scale(.94)',filter:'blur(6px)'}],{duration:dur,delay,fill:'both',easing:'ease-out'}).onfinish=()=>b.remove();
}
function fxDelta(key,d){
  const el=document.querySelector(`[data-stat="${key}"]`);
  if(key!=='marea')fxFloat(el,`${d>0?'+':'−'}${Math.abs(d)} ${FX_NAME[key]}`,d<0&&key==='cordura'?'#ff8a78':FX_COL[key]);
  if(el&&(key==='saber'||key==='vol')){const b=el.querySelector('b');b&&b.animate([{transform:'scale(1.6)'},{transform:'none'}],{duration:450,easing:'ease-out'});}
  if(key==='cordura'&&d<0){fxShake(Math.min(4,1-d));fxFlash('hurt');}
  if(key==='cordura'&&d>0)fxFlash('heal');
  if(key==='perd'&&d>0){fxFlash('doom');const m=document.querySelector('.moon');m&&m.animate([{filter:'none'},{filter:'brightness(1.6) drop-shadow(0 0 30px #c0503f)'},{filter:'none'}],{duration:1200});}
}
function fxEvents(list){
  for(const l of list){
    const m=l.m;
    if(l.cls==='turn'&&m.startsWith('Ronda')){const [h,p]=m.split(' · ');fxBanner(h,p,'turn',1400);}
    else if(l.cls==='turn'&&m.startsWith('Turno de ')){fxBanner(m.slice(9),'toma el relevo','turn',1400);}
    else if(m.startsWith('Augurio · ')){const t=m.slice(10),i=t.indexOf(': ');fxBanner('Augurio: '+(i<0?t:t.slice(0,i)),i<0?'':t.slice(i+2),'doom',2300);}
    else if(m.includes('emerge de las aguas')){fxBanner(BOSS().n,'emerge de las aguas','boss',2800);fxShake(6);fxFlash('doom');}
    else if(m.includes(' ataca')){
      const name=m.split(' ataca')[0];
      const el=[...document.querySelectorAll('#app .horror')].find(h=>h.querySelector('.h-name').textContent===name);
      el&&el.animate([{transform:'none'},{transform:'scale(1.14) translateY(14px) rotate(-2deg)',filter:'brightness(1.6) drop-shadow(0 0 18px #c0503f)',offset:.3},{transform:'none'}],{duration:650,easing:'ease-out'});
    }
  }
  if(G.phase==='over'){fxShake(G.result.win?2:6);if(G.result.win){const r=innerWidth/2;for(let k=0;k<4;k++)setTimeout(()=>fxBurst(r+(Math.random()-.5)*innerWidth*.6,innerHeight*(.3+Math.random()*.3),k%2?'#f0c070':'#7fc3b4',30,'out'),300+k*250);}}
}
function handle(a,u){
  switch(a){
    case 'diff':UI.diff=u;break;
    case 'boss':UI.boss=u;break;
    case 'inv':{const i=UI.invs.indexOf(u);if(i>=0)UI.invs.splice(i,1);else if(UI.invs.length<3)UI.invs.push(u);break;}
    case 'start':if(UI.invs.length)newGame(UI.diff,UI.boss,[...UI.invs]);break;
    case 'play':playCard(+u);break;
    case 'playall':playAll();break;
    case 'exile':exile(+u);break;
    case 'skip':skipPending();break;
    case 'target':targetHorror(+u);break;
    case 'kill':killHorror(+u);break;
    case 'free':takeFree(+u);break;
    case 'buy':buy(+u);break;
    case 'pile':buyPile(u);break;
    case 'renew':renew();break;
    case 'attack':attack(+u);break;
    case 'wound':wound(+u);break;
    case 'power':usePower();break;
    case 'end':{const before=G.cur;endTurn();if(HAS_DOM&&G.cur!==before)window.scrollTo(0,0);break;}
    case 'askquit':UI.confirmQuit=true;break;
    case 'noquit':UI.confirmQuit=false;break;
    case 'quit':case 'again':G=null;UI.confirmQuit=false;break;
  }
}
if(HAS_DOM){
  document.getElementById('app').addEventListener('click',e=>{
    const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
    const wasTitle=!G;fxBefore();handle(b.dataset.a,b.dataset.u);render();
    if(wasTitle&&G)window.scrollTo(0,0);
    fxAfter();
  });
  const boot=data=>{
    if(data&&data.G)G=data.G;
    else{try{const s=localStorage.getItem(KEY);if(s){const g=JSON.parse(s);if(g&&g.phase==='play'&&g.invs)G=g;}}catch(e){}}
    render();fxAfter();
  };
  try{window.claude?.hot?.snapshot?.(()=>({G}));}catch(e){}
  window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
}
</script>

</body></html>
